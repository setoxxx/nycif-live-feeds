name: Deploy supplemental export preview to Field Desk

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/field-desk-map-deploy/supplemental-export-preview/**"
      - "docs/field-desk-map-deploy/shared/**"
      - "dist/supplemental_approved_export_feed.json"
      - "dist/supplemental_approved_export_map_pins.json"
      - "dist/supplemental_cultural_anniversary_staging.json"
      - "dist/supplemental_press_geofence_staging.json"
      - "dist/nypd_precincts/**"
      - "scripts/deploy_supplemental_preview_to_field_desk.sh"
      - ".github/workflows/field-desk-supplemental-preview-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live-feeds deploy sources
        uses: actions/checkout@v4

      - name: Sync supplemental export preview to field-desk
        env:
          FIELD_DESK_TOKEN: ${{ secrets.FIELD_DESK_DEPLOY_TOKEN }}
        run: bash scripts/deploy_supplemental_preview_to_field_desk.sh
