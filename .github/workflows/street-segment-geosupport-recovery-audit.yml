name: Street Segment GeoSupport Recovery Audit

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_geosupport_recovery_v2.py'
      - 'tests/test_street_segment_geosupport_recovery_v2.py'
      - '.github/workflows/street-segment-geosupport-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  street-segment-geosupport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEO_VERSION: 25c
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'no'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "${actual}" = "${expected}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NYC Planning Geosupport Desktop Edition 25c
        shell: bash
        run: |
          set -euo pipefail
          num="${GEO_VERSION:0:2}"
          letter="${GEO_VERSION: -1}"
          case "$letter" in
            a) minor=1;;
            b) minor=2;;
            c) minor=3;;
            *) echo "Unsupported GEO_VERSION: $GEO_VERSION" >&2; exit 1;;
          esac
          filename="linux_geo${GEO_VERSION}_${num}.${minor}.zip"
          url="https://s-media.nyc.gov/agencies/dcp/assets/files/zip/data-tools/bytes/geosupport/${filename}"
          curl --fail --location --retry 3 --output "$filename" "$url"
          mkdir -p /tmp/geosupport-install-lx
          unzip -q "$filename" -d /tmp/geosupport-install-lx
          geo_dir="$(find /tmp/geosupport-install-lx -type d -name "version-${GEO_VERSION}_*" | head -n 1)"
          test -n "$geo_dir"
          echo "GEOFILES=${geo_dir}/fls/" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${geo_dir}/lib/:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install dependencies and pinned public Python wrapper
        shell: bash
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install 'git+https://github.com/ishiland/python-geosupport.git@82c39e82b4d4dc7773fa67d32ef7f3787ef4d27e'

      - name: Compile and test non-public audit
        run: |
          python3 -m py_compile scripts/audit_street_segment_geosupport_recovery_v2.py
          python3 -m unittest tests.test_street_segment_geosupport_recovery_v2 -v

      - name: Run local authoritative street-segment evidence audit
        run: |
          mkdir -p /tmp/nycif-street-geosupport-audit
          python3 scripts/audit_street_segment_geosupport_recovery_v2.py \
            --output /tmp/nycif-street-geosupport-audit/street_segment_geosupport_recovery_audit_v2.json

      - name: Prove hard non-public gates and clean worktree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          path = '/tmp/nycif-street-geosupport-audit/street_segment_geosupport_recovery_audit_v2.json'
          report = json.load(open(path, encoding='utf-8'))
          assert report['read_only'] is True
          assert report['promotion_allowed'] is False
          assert report['publication_authority_granted'] is False
          assert report['public_map_modified'] is False
          assert report['location_cache_modified'] is False
          assert report['projector_consumed'] is False
          assert all(value == 0 for value in report['hard_zero_gates'].values())
          PY
          test -z "$(git status --porcelain)"

      - name: Upload non-public recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-geosupport-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nycif-street-geosupport-audit
          retention-days: 14
