name: Street Segment GeoSupport Recovery Audit

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_geosupport_recovery_v2.py'
      - 'tests/test_street_segment_geosupport_recovery_v2.py'
      - '.github/workflows/street-segment-geosupport-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  street-segment-geosupport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEOSUPPORT_RUNTIME_IMAGE: 'nycplanning/docker-geosupport:26.2.0'
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'no'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "${actual}" = "${expected}"

      - name: Pull pinned NYC Planning GeoSupport runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$GEOSUPPORT_RUNTIME_IMAGE"
          docker image inspect "$GEOSUPPORT_RUNTIME_IMAGE" --format 'NYCIF_GEOSUPPORT_IMAGE_ID={{.Id}}'

      - name: Verify official runtime contains Python GeoSupport binding
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$GEOSUPPORT_RUNTIME_IMAGE" \
            python -c 'from geosupport import Geosupport; g = Geosupport(); print("NYCIF_GEOSUPPORT_IMPORT_OK=1")'

      - name: Compile and test non-public audit inside official runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e NYCIF_ALLOW_LIVE_GEOSEARCH=no \
            -e NYCIF_ALLOW_LIVE_GEOCLIENT=no \
            -e GEOSUPPORT_RUNTIME_IMAGE="$GEOSUPPORT_RUNTIME_IMAGE" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            "$GEOSUPPORT_RUNTIME_IMAGE" \
            bash -lc 'python -c "from pathlib import Path; p=Path(\"scripts/audit_street_segment_geosupport_recovery_v2.py\"); compile(p.read_text(encoding=\"utf-8\"), str(p), \"exec\")" && python -m unittest tests.test_street_segment_geosupport_recovery_v2 -v'

      - name: Run local authoritative street-segment evidence audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-street-geosupport-audit
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e NYCIF_ALLOW_LIVE_GEOSEARCH=no \
            -e NYCIF_ALLOW_LIVE_GEOCLIENT=no \
            -e GEOSUPPORT_RUNTIME_IMAGE="$GEOSUPPORT_RUNTIME_IMAGE" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/nycif-street-geosupport-audit:/evidence \
            -w /workspace \
            "$GEOSUPPORT_RUNTIME_IMAGE" \
            python scripts/audit_street_segment_geosupport_recovery_v2.py \
              --output /evidence/street_segment_geosupport_recovery_audit_v2.json

      - name: Prove hard non-public gates and clean worktree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          path = '/tmp/nycif-street-geosupport-audit/street_segment_geosupport_recovery_audit_v2.json'
          report = json.load(open(path, encoding='utf-8'))
          assert report['read_only'] is True
          assert report['promotion_allowed'] is False
          assert report['publication_authority_granted'] is False
          assert report['public_map_modified'] is False
          assert report['location_cache_modified'] is False
          assert report['projector_consumed'] is False
          assert report['api_credentials_required'] is False
          assert report['geosupport_runtime_image'] == 'nycplanning/docker-geosupport:26.2.0'
          assert all(value == 0 for value in report['hard_zero_gates'].values())
          PY
          test -z "$(git status --porcelain)"

      - name: Upload non-public recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-geosupport-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nycif-street-geosupport-audit
          retention-days: 14
