name: Pin Recovery Wave A Inventory

on:
  pull_request:
    paths:
      - '.github/workflows/pin-recovery-wave-a-inventory.yml'
      - 'scripts/build_pin_recovery_wave_a_inventory.py'
      - 'scripts/project_events_discovery_v03.py'
      - 'scripts/build_maplibre_reader_safe_v03.py'
      - 'scripts/nyc_location_resolver.py'
      - 'scripts/location_evidence_contract.py'

permissions:
  contents: read

jobs:
  wave-a-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Attest exact PR head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_PR_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "${actual}" = "${expected}"

      - name: Check out historical READY evidence baseline
        uses: actions/checkout@v4
        with:
          repository: setoxxx/nycif-live-feeds
          ref: 3276cc50d8544425891f06765a3ab5c12fa46343
          path: _historical_ready
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile Wave A inventory
        run: python3 -m py_compile scripts/build_pin_recovery_wave_a_inventory.py

      - name: Refresh official sources through current semantic intake
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
        run: |
          python3 scripts/live_event_intake_refresh.py
          python3 scripts/refresh_official_supplemental_occurrences.py

      - name: Project current corpus through V3 authority
        run: |
          python3 scripts/project_events_discovery_v03.py
          python3 scripts/enforce_strict_discovery_reconciliation.py
          python3 scripts/build_maplibre_reader_safe_v03.py

      - name: Prove current V3 safety gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('data/reader-safe/national-map-events-v03-status.json').read_text())
          assert status.get('qa_pass') is True, status
          for key in (
              'unsupported_marker_count',
              'wrong_authority_marker_count',
              'location_evidence_failure_count',
              'borough_contradiction_count',
              'duplicate_exact_occurrence_count',
              'duplicate_reader_occurrence_count',
              'general_area_exact_geometry_count',
          ):
              assert status.get(key, 0) == 0, (key, status.get(key))
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Build exhaustive Wave A Pin Recovery inventory
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
        run: python3 scripts/build_pin_recovery_wave_a_inventory.py --historical-root _historical_ready

      - name: Prove inventory is exhaustive and non-mutating
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('data/reports/NYC_EVENT_HISTORICAL_PIN_RECONCILIATION_V1.json').read_text())
          queue = json.loads(Path('data/reports/NYC_EVENT_PIN_RECOVERY_QUEUE_V1.json').read_text())
          census = json.loads(Path('data/reports/NYC_EVENT_PIN_RECOVERY_REASON_CENSUS_V1.json').read_text())

          assert history.get('qa_pass') is True, history
          assert census.get('qa_pass') is True, census
          assert queue.get('promotion_allowed') is False, queue
          assert queue.get('queue_total') == census.get('queue_total'), (queue.get('queue_total'), census.get('queue_total'))
          assert queue.get('queue_total') == history.get('current_nonmarker_standalone_public_rows'), history
          assert all(item.get('promotion_allowed') is False for item in queue.get('queue', []))
          assert all(item.get('public_map_modified') is False for item in queue.get('queue', []))
          assert all(item.get('identity_modified') is False for item in queue.get('queue', []))
          assert all(item.get('temporal_state_modified') is False for item in queue.get('queue', []))

          print(json.dumps({
              'status': 'PIN_RECOVERY_WAVE_A_INVENTORY_PASS',
              'current_canonical_rows': history.get('current_canonical_rows'),
              'queue_total': queue.get('queue_total'),
              'immediately_reproducible_high_confidence': queue.get('immediately_reproducible_high_confidence'),
              'reason_counts': census.get('reason_counts'),
          }, indent=2, sort_keys=True))
          PY

      - name: Upload Wave A evidence
        uses: actions/upload-artifact@v4
        with:
          name: pin-recovery-wave-a-${{ github.event.pull_request.head.sha }}
          path: |
            data/reports/NYC_EVENT_HISTORICAL_PIN_RECONCILIATION_V1.json
            data/reports/NYC_EVENT_PIN_RECOVERY_QUEUE_V1.json
            data/reports/NYC_EVENT_PIN_RECOVERY_REASON_CENSUS_V1.json
            data/reader-safe/national-map-events-v03-status.json
            data/nyc_parks_bigapps_events_sync_report.json
            data/nyc_citywide_events_calendar_sync_report.json
            data/live_sync_report.json
            data/events_discovery_reconciliation_v02.json
          retention-days: 14
