name: Run Stage 8 List-Only Inventory Once

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/stage8_list_only_coordinate_inventory.py
      - scripts/stage8_match_supported_coordinate_proposals.py
      - .stage8-pr-trigger
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - .stage8-list-only-inventory-trigger

permissions:
  contents: write
  issues: write

jobs:
  inventory:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event.issue.title == 'RUN STAGE 8 LIST-ONLY INVENTORY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage8-list-only-coordinate-resolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate canonical Stage 8 inventory
        run: python scripts/stage8_list_only_coordinate_inventory.py
      - name: Verify exact reconciliation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/stage8_list_only_coordinate_inventory.json').read_text())
          proposals = json.loads(Path('data/reports/stage8_list_only_coordinate_proposals.json').read_text())
          assert report['schema_version'] == '2.2.0'
          assert report['qa_pass'] is True
          assert report['list_only_total'] == 997
          assert report['expected_from_reconciliation']['list_only_total'] == 997
          assert report['equations']['list_only_matches_reconciliation'] is True
          assert report['equations']['queue_declared_count_matches_rows'] is True
          assert report['equations']['all_records_reason_coded'] is True
          assert report['equations']['all_selected_proposals_valid'] is True
          assert report['production_data_modified'] is False
          assert report['promotion_allowed'] is False
          assert proposals['promotion_allowed'] is False
          assert proposals['proposal_total'] == report['proposal_total']
          PY
          git diff --exit-code -- data/events_discovery_v02_approved.json data/nycif_staged_live_events.json data/supplemental_events_staging_feed.json
      - name: Dry-run match supported proposals upstream
        run: python scripts/stage8_match_supported_coordinate_proposals.py || true
      - name: Commit Stage 8 evidence
        run: |
          git add data/reports/stage8_list_only_coordinate_inventory.json data/reports/stage8_list_only_coordinate_proposals.json data/reports/stage8_supported_coordinate_match_report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Stage 8 coordinate evidence [skip ci]'
          git push origin HEAD:feature/stage8-list-only-coordinate-resolution
      - name: Upload Stage 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage8-list-only-coordinate-inventory
          path: |
            data/reports/stage8_list_only_coordinate_inventory.json
            data/reports/stage8_list_only_coordinate_proposals.json
            data/reports/stage8_supported_coordinate_match_report.json
          if-no-files-found: error
