name: Authoritative Facility Resolver Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query official NYC Open Data catalog and schemas
        run: python3 scripts/discover_authoritative_facility_sources.py
      - name: Upload source contracts
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-facility-source-contracts
          path: data/authoritative_facility_source_contracts.json
