name: GPS Staged Feed Integration Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gps-staged-feed-integration-update.yml'
      - 'scripts/apply_gps_staged_feed_integration_update.py'

permissions:
  contents: write

concurrency:
  group: gps-staged-feed-integration-update
  cancel-in-progress: false

jobs:
  update-staged-feed-gps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply promoted GPS records to staged feed only
        run: python scripts/apply_gps_staged_feed_integration_update.py

      - name: Commit staged feed GPS integration update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nycif_staged_live_events.json data/gps_staged_feed_integration_update_report.json
          if git diff --cached --quiet; then
            echo "No staged feed GPS integration changes to commit."
          else
            git commit -m "Run staged feed GPS integration update"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
