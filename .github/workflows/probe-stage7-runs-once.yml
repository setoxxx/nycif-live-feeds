name: Probe Stage 7 Runs Once

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  probe:
    if: github.event.issue.title == 'PROBE STAGE 7 RUNS'
    runs-on: ubuntu-latest
    steps:
      - name: Read current Stage 7 and production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          discovery="$(gh api 'repos/${{ github.repository }}/actions/workflows/discovery-feed-refresh.yml/runs?per_page=5' --jq '[.workflow_runs[] | {id,name,event,status,conclusion,head_sha,head_branch,created_at,updated_at,html_url}]')"
          v2="$(gh api 'repos/${{ github.repository }}/actions/workflows/run-stage7-production-refresh-v2-once.yml/runs?per_page=5' --jq '[.workflow_runs[] | {id,name,event,status,conclusion,head_sha,head_branch,created_at,updated_at,html_url}]' 2>/dev/null || echo '[]')"
          issue_runner="$(gh api 'repos/${{ github.repository }}/actions/workflows/run-stage7-production-refresh-once.yml/runs?per_page=5' --jq '[.workflow_runs[] | {id,name,event,status,conclusion,head_sha,head_branch,created_at,updated_at,html_url}]' 2>/dev/null || echo '[]')"
          body=$(cat <<EOF
          Stage 7 Actions probe:

          Discovery Feed Refresh:
          \`\`\`json
          ${discovery}
          \`\`\`

          Push-triggered Stage 7 runner:
          \`\`\`json
          ${v2}
          \`\`\`

          Issue-triggered Stage 7 runner:
          \`\`\`json
          ${issue_runner}
          \`\`\`
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
      - name: Remove one-time probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/probe-stage7-runs-once.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
              -f message='Remove completed Stage 7 Actions probe' \
              -f sha="$sha" \
              -f branch='main'
          fi
