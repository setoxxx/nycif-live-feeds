name: Street Segment GeoSupport 3S Route V5

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_geosupport_3s_route_v5.py'
      - 'tests/test_street_segment_geosupport_3s_route_v5.py'
      - '.github/workflows/street-segment-geosupport-3s-route-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geosupport-3s-route-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEOSUPPORT_RUNTIME_IMAGE: 'nycplanning/docker-geosupport:26.2.0'
      LION_DATASET_URL: 'https://data.cityofnewyork.us/download/2v4z-66xt/application/zip'
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'no'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies and test V5 topology audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin unzip
          python3 -m py_compile scripts/audit_street_segment_geosupport_3s_route_v5.py
          python3 -m unittest tests.test_street_segment_geosupport_3s_route_v5 -v

      - name: Pull official NYC Planning GeoSupport runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$GEOSUPPORT_RUNTIME_IMAGE"
          docker run --rm "$GEOSUPPORT_RUNTIME_IMAGE" \
            python -c 'from geosupport import Geosupport; Geosupport(); print("NYCIF_GEOSUPPORT_IMPORT_OK=1")'

      - name: Rebuild strict V2 identity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-route-v5
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e NYCIF_ALLOW_LIVE_GEOSEARCH=no \
            -e NYCIF_ALLOW_LIVE_GEOCLIENT=no \
            -e GEOSUPPORT_RUNTIME_IMAGE="$GEOSUPPORT_RUNTIME_IMAGE" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/nycif-route-v5:/evidence \
            -w /workspace \
            "$GEOSUPPORT_RUNTIME_IMAGE" \
            python scripts/audit_street_segment_geosupport_recovery_v2.py \
              --output /evidence/street_segment_geosupport_recovery_audit_v2.json

      - name: Download official current LION package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/nycif-route-v5/lion.zip \
            "$LION_DATASET_URL"
          unzip -q /tmp/nycif-route-v5/lion.zip -d /tmp/nycif-route-v5/lion-package

      - name: Discover unique official LION SegmentID layer
        shell: bash
        run: |
          set -euo pipefail
          candidates=/tmp/nycif-route-v5/layer-candidates.tsv
          : > "$candidates"
          while IFS= read -r gdb; do
            layer_list="$(ogrinfo -ro "$gdb" 2>/dev/null || true)"
            while IFS= read -r layer; do
              [ -n "$layer" ] || continue
              info="$(ogrinfo -ro -so "$gdb" "$layer" 2>/dev/null || true)"
              if printf '%s\n' "$info" | grep -qiE '^[[:space:]]*SegmentID:' && printf '%s\n' "$info" | grep -qiE '^[[:space:]]*Geometry: (Line String|Multi Line String)'; then
                printf 'gdb\t%s\t%s\n' "$gdb" "$layer" >> "$candidates"
              fi
            done < <(
              printf '%s\n' "$layer_list" | sed -n -E \
                -e 's/^Layer: (.*) \([^)]*\)$/\1/p' \
                -e 's/^[[:space:]]*[0-9]+: (.*) \([^)]*\)$/\1/p' | sort -u
            )
          done < <(find /tmp/nycif-route-v5/lion-package -type d -iname '*.gdb' | sort)
          cat "$candidates"
          count="$(wc -l < "$candidates" | tr -d ' ')"
          test "$count" -eq 1
          IFS=$'\t' read -r kind source layer < "$candidates"
          echo "LION_SOURCE_PATH=$source" >> "$GITHUB_ENV"
          echo "LION_SOURCE_LAYER=$layer" >> "$GITHUB_ENV"

      - name: Extract V2 SegmentID geometries and rebuild V4 classification
        shell: bash
        run: |
          set -euo pipefail
          where_clause="$(python3 - <<'PY'
          import json
          report = json.load(open('/tmp/nycif-route-v5/street_segment_geosupport_recovery_audit_v2.json', encoding='utf-8'))
          ids = sorted({str(row.get('function_3_segment_identifier') or '').strip() for row in report.get('claims', []) if row.get('strict_nonpublic_segment_evidence') is True} - {''})
          escaped = [value.replace("'", "''") for value in ids]
          print('SegmentID IN (' + ','.join("'" + value + "'" for value in escaped) + ')')
          PY
          )"
          ogr2ogr -f GeoJSON -t_srs EPSG:4326 -where "$where_clause" \
            /tmp/nycif-route-v5/lion_strict_segments.geojson \
            "$LION_SOURCE_PATH" "$LION_SOURCE_LAYER"
          python3 scripts/audit_street_segment_lion_geometry_v4.py \
            --identity-report /tmp/nycif-route-v5/street_segment_geosupport_recovery_audit_v2.json \
            --lion-geojson /tmp/nycif-route-v5/lion_strict_segments.geojson \
            --output /tmp/nycif-route-v5/street_segment_lion_geometry_audit_v4.json

      - name: Run official GeoSupport 3S ordered-route audit
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e NYCIF_ALLOW_LIVE_GEOSEARCH=no \
            -e NYCIF_ALLOW_LIVE_GEOCLIENT=no \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/nycif-route-v5:/evidence \
            -w /workspace \
            "$GEOSUPPORT_RUNTIME_IMAGE" \
            python scripts/audit_street_segment_geosupport_3s_route_v5.py \
              --v4-report /evidence/street_segment_lion_geometry_audit_v4.json \
              --output /evidence/street_segment_geosupport_3s_route_audit_v5.json

      - name: Prove V5 topology remains non-public and current-targeted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v4 = json.load(open('/tmp/nycif-route-v5/street_segment_lion_geometry_audit_v4.json', encoding='utf-8'))
          v5 = json.load(open('/tmp/nycif-route-v5/street_segment_geosupport_3s_route_audit_v5.json', encoding='utf-8'))
          assert v5['target_claim_count'] == v4['reason_counts'].get('LION_GEOMETRY_ENDPOINT_DISAGREEMENT', 0)
          assert v5['read_only'] is True
          assert v5['promotion_allowed'] is False
          assert v5['publication_authority_granted'] is False
          assert v5['public_renderer_enabled'] is False
          assert v5['projector_consumed'] is False
          assert v5['geometry_join_completed'] is False
          assert v5['shortest_path_algorithm_used'] is False
          assert all(value == 0 for value in v5['hard_zero_gates'].values())
          PY
          test -z "$(git status --porcelain)"

      - name: Upload non-public V5 route topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-route-v5-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nycif-route-v5/street_segment_geosupport_recovery_audit_v2.json
            /tmp/nycif-route-v5/street_segment_lion_geometry_audit_v4.json
            /tmp/nycif-route-v5/street_segment_geosupport_3s_route_audit_v5.json
            /tmp/nycif-route-v5/layer-candidates.tsv
          retention-days: 14
