name: BORG Adaptive Dataset Topology QA

on:
  pull_request:
    paths:
      - 'docs/contracts/BORG_ADAPTIVE_DATASET_TOPOLOGY_V1.json'
      - 'docs/contracts/BORG_DATASET_RECIPE_REGISTRY_V1.json'
      - 'docs/contracts/BORG_MISSION_ACQUISITION_V1.json'
      - 'docs/contracts/BORG_SOURCE_REGISTRY_V1.json'
      - 'docs/contracts/BORG_FREQ_DISCOVERY_BRIDGE_V1.json'
      - 'scripts/borg_adaptive_dataset_topology.py'
      - 'scripts/borg_source_frontier.py'
      - 'scripts/borg_freq_search_plan.py'
      - 'tests/test_borg_adaptive_dataset_topology.py'
      - 'tests/test_borg_mission_and_freq_bridge.py'
      - 'tests/test_borg_source_frontier.py'
      - 'tests/test_borg_freq_search_plan.py'
      - '.github/workflows/borg-adaptive-dataset-topology-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-topology-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile interpreter, planners and tests
        run: |
          python3 -m py_compile \
            scripts/borg_adaptive_dataset_topology.py \
            scripts/borg_source_frontier.py \
            scripts/borg_freq_search_plan.py \
            tests/test_borg_adaptive_dataset_topology.py \
            tests/test_borg_mission_and_freq_bridge.py \
            tests/test_borg_source_frontier.py \
            tests/test_borg_freq_search_plan.py
      - name: Run adaptive topology, acquisition, frontier and FREQ bridge regressions
        run: |
          python3 -m unittest \
            tests.test_borg_adaptive_dataset_topology \
            tests.test_borg_mission_and_freq_bridge \
            tests.test_borg_source_frontier \
            tests.test_borg_freq_search_plan -v
      - name: Verify adaptive contract invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/contracts/BORG_ADAPTIVE_DATASET_TOPOLOGY_V1.json').read_text())
          r = json.loads(Path('docs/contracts/BORG_DATASET_RECIPE_REGISTRY_V1.json').read_text())
          m = json.loads(Path('docs/contracts/BORG_MISSION_ACQUISITION_V1.json').read_text())
          s = json.loads(Path('docs/contracts/BORG_SOURCE_REGISTRY_V1.json').read_text())
          f = json.loads(Path('docs/contracts/BORG_FREQ_DISCOVERY_BRIDGE_V1.json').read_text())
          assert c['contract'] == 'nycif.borg-adaptive-dataset-topology.v1'
          assert c['recipe_policy']['unknown_schema_public_projection_allowed'] is False
          assert c['recipe_policy']['structural_match_can_self_promote_recipe'] is False
          assert c['recipe_policy']['recipe_mutation_requires_review'] is True
          assert c['topology']['provenance_required_on_every_node_and_edge'] is True
          assert c['topology']['contradictions_are_preserved_not_overwritten'] is True
          assert c['authority']['no_second_authority'] is True
          assert r['contract'] == 'nycif.borg-dataset-recipe-registry.v1'
          assert all(x['culture_claim_power'] == 'NONE' for x in r['recipes'])
          assert m['contract'] == 'nycif.borg-mission-acquisition.v1'
          assert m['automated_retrieval_policy']['private_or_loopback_network_targets_allowed'] is False
          assert m['learning']['may_self_authorize_new_rights_or_publication'] is False
          assert s['contract'] == 'nycif.borg-source-registry.v1'
          assert 'rights' in s['required_fields']
          assert 'schema_fingerprint' in s['required_fields']
          assert f['contract'] == 'nycif.borg-freq-discovery-bridge.v1'
          assert f['location_rules']['borg_may_infer_incident_location_from_receiver_location'] is False
          assert f['location_rules']['borg_may_triangulate_transmitter_or_caller_location'] is False
          assert f['public_projection']['freq_public_alert_truth_remains_in_freq'] is True
          assert f['current_dependency_state']['freq_integration_freeze'] is True
          PY
