name: Deploy to Field Desk Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/field-desk-map-deploy/schema-v1-major-all-v01/**"
      - "docs/field-desk-map-deploy/shared/**"
      - "docs/field-desk-map-deploy/discovery-taxonomy-v02/discovery-patch-v02.js"
      - "docs/field-desk-map-deploy/discovery-taxonomy-v02/public-approved-overlays-v01.js"
      - "docs/field-desk-admin-deploy/admin/**"
      - ".github/workflows/field-desk-complete-map-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live-feeds canonical deploy sources
        uses: actions/checkout@v4

      - name: Sync map + admin runtime to field-desk
        env:
          FIELD_DESK_TOKEN: ${{ secrets.FIELD_DESK_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIELD_DESK_TOKEN:-}" ]; then
            echo "::error::FIELD_DESK_DEPLOY_TOKEN secret is not configured on nycif-live-feeds."
            exit 1
          fi

          MAP_SRC="$GITHUB_WORKSPACE/docs/field-desk-map-deploy"
          ADMIN_SRC="$GITHUB_WORKSPACE/docs/field-desk-admin-deploy/admin"
          git clone "https://x-access-token:${FIELD_DESK_TOKEN}@github.com/setoxxx/nycif-field-desk.git" /tmp/field-desk
          cd /tmp/field-desk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main

          cp "$MAP_SRC/schema-v1-major-all-v01/app-schema-v1-major-all-v01.js" ./app-schema-v1-major-all-v01.js
          cp "$MAP_SRC/discovery-taxonomy-v02/discovery-patch-v02.js" ./discovery-patch-v02.js
          cp "$MAP_SRC/discovery-taxonomy-v02/public-approved-overlays-v01.js" ./public-approved-overlays-v01.js
          cp "$MAP_SRC/schema-v1-major-all-v01/index.html" ./index.html
          cp "$MAP_SRC/schema-v1-major-all-v01/public-map-v01.css" ./public-map-v01.css
          cp "$MAP_SRC/schema-v1-major-all-v01/service-worker.js" ./service-worker.js
          cp "$MAP_SRC/shared/nycif-tip-jar-v01.js" ./nycif-tip-jar-v01.js
          mkdir -p ./tools/public-map
          cp "$MAP_SRC/schema-v1-major-all-v01/public-map-ui.test.mjs" ./tools/public-map/public-map-ui.test.mjs

          # Retire orphaned public-map runtimes from Pages root (desk.html still uses app-v06-safe.js).
          rm -f ./staged-map-mode-v01.css

          cp "$ADMIN_SRC/index.html" ./admin/index.html
          cp "$ADMIN_SRC/live-pipeline-panel-v02.js" ./admin/live-pipeline-panel-v02.js
          cp "$ADMIN_SRC/discovery-godview-panel-v02.js" ./admin/discovery-godview-panel-v02.js
          cp "$ADMIN_SRC/civic-godview-panel-v01.js" ./admin/civic-godview-panel-v01.js
          cp "$ADMIN_SRC/photographer-calendar-panel-v01.js" ./admin/photographer-calendar-panel-v01.js

          grep -q "[/basketball/i, '🏀']" app-schema-v1-major-all-v01.js
          grep -q reviewManifest app-schema-v1-major-all-v01.js
          grep -q "schema-v1-discovery" discovery-patch-v02.js
          grep -q 'media: { emoji' discovery-patch-v02.js
          grep -q public-map-v08 index.html
          grep -q 'data-cat="media"' index.html
          grep -q admin-whats-new-v01.js index.html
          grep -q nycif-tip-jar-v01.js index.html
          grep -q 'nycif-tip-jar-v01.js?v=05' index.html
          grep -q brand-header-row index.html
          grep -q brand-header-row public-map-v01.css
          grep -q panel-sub-label index.html
          grep -q '#374151' public-approved-overlays-v01.js
          node --check app-schema-v1-major-all-v01.js
          node --check discovery-patch-v02.js
          node --check nycif-tip-jar-v01.js
          node --check service-worker.js
          node --check public-approved-overlays-v01.js
          node --test tools/public-map/public-map-ui.test.mjs

          grep -q discovery-godview-panel-v02 admin/index.html
          grep -q live-pipeline-panel-v02 admin/index.html
          grep -q god-view-project-control-v01 admin/index.html
          grep -q legacy-admin-data-v01 admin/index.html
          node --check admin/live-pipeline-panel-v02.js
          node --check admin/discovery-godview-panel-v02.js
          node --check admin/civic-godview-panel-v01.js
          node --check admin/photographer-calendar-panel-v01.js

          git add \
            app-schema-v1-major-all-v01.js \
            discovery-patch-v02.js \
            public-approved-overlays-v01.js \
            index.html \
            public-map-v01.css \
            service-worker.js \
            nycif-tip-jar-v01.js \
            tools/public-map/public-map-ui.test.mjs \
            admin/index.html \
            admin/live-pipeline-panel-v02.js \
            admin/discovery-godview-panel-v02.js \
            admin/civic-godview-panel-v01.js \
            admin/photographer-calendar-panel-v01.js

          if git diff --cached --quiet; then
            echo "Field-desk already has canonical map + admin runtime."
            exit 0
          fi
          git commit -m "Deploy RC public map v08: tip jar strobe, centered panel, legacy cleanup"
          git push origin main
