name: Location Authority + Source Adapter QA

on:
  pull_request:
    paths:
      - 'scripts/build_location_resolution_backlog_v1.py'
      - 'tests/test_location_resolution_backlog_v1.py'
      - 'scripts/sync_supabase_location_registry_v1.py'
      - 'tests/test_supabase_location_registry_sync_v1.py'
      - 'scripts/sources/**'
      - 'tests/test_ticketmaster_source_adapter.py'
      - '.github/workflows/location-authority-adapters-ci.yml'
      - '.github/workflows/discovery-feed-refresh.yml'

permissions:
  contents: read

jobs:
  location-authority-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile scripts/build_location_resolution_backlog_v1.py scripts/sync_supabase_location_registry_v1.py scripts/sources/base.py scripts/sources/ticketmaster.py
      - name: Test backlog classification
        run: python -m unittest tests.test_location_resolution_backlog_v1 -v
      - name: Classify current canonical backlog without promotion
        run: |
          python scripts/build_location_resolution_backlog_v1.py
          python - <<'PY'
          import json
          report = json.load(open('data/location_resolution_backlog_v1_report.json'))
          rows = json.load(open('data/location_resolution_backlog_v1.json')).get('rows', [])
          status = json.load(open('data/reader-safe/national-map-events-v03-status.json'))
          expected = int(status.get('map_state_counts', {}).get('LIST_ONLY', 0)) + int(status.get('map_state_counts', {}).get('REVIEW_REQUIRED', 0))
          if report.get('qa_pass') is not True:
              raise SystemExit('backlog report failed QA')
          if report.get('unresolved_canonical_occurrence_count') != len(rows):
              raise SystemExit('backlog report/row count mismatch')
          if report.get('unresolved_canonical_before_cancel_suppression', 0) <= 0:
              raise SystemExit('canonical backlog unexpectedly returned zero unresolved rows')
          if report.get('v3_status_comparable') is True:
              if report.get('canonical_state_count_matches_v3_status') is not True:
                  raise SystemExit('same-release backlog does not match V3 status')
              if report.get('unresolved_canonical_before_cancel_suppression') != expected:
                  raise SystemExit('same-release backlog does not equal V3 LIST_ONLY + REVIEW_REQUIRED')
          else:
              if report.get('canonical_state_count_matches_v3_status') is not None:
                  raise SystemExit('stale cross-generation artifacts must not be compared as one release')
          if report.get('promotion_attempt_count') != 0:
              raise SystemExit('backlog attempted promotion')
          for key in ('public_map_modified', 'location_cache_modified', 'staged_feed_modified'):
              if report.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          if any(r.get('promotion_allowed') is not False or r.get('manual_review_status') != 'pending' for r in rows):
              raise SystemExit('backlog contains a promoted or non-pending row')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Test durable registry payload
        run: python -m unittest tests.test_supabase_location_registry_sync_v1 -v
      - name: Ticketmaster adapter
        run: python -m unittest tests.test_ticketmaster_source_adapter -v
      - name: Protect canonical identity contract
        run: python -m unittest tests.test_occurrence_identity_contract -v
