name: Discovery Taxonomy v02 QA

on:
  pull_request:
  push:
    branches:
      - 'cursor/discovery-taxonomy-v02-27bf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nycif-discovery-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-v02-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Date-safe live event intake refresh regression
        run: python scripts/test_live_event_intake_refresh_current.py
      - name: Daily production hardening regressions
        run: |
          python scripts/test_daily_production_hardening.py
          python -m py_compile \
            scripts/run_daily_refresh_stage.py \
            scripts/test_live_event_intake_refresh_current.py \
            scripts/live_event_intake_refresh.py \
            scripts/sync_nyc_citywide_events_calendar.py \
            scripts/build_staged_production_feed.py \
            scripts/refresh_official_supplemental_occurrences.py \
            scripts/enforce_strict_discovery_reconciliation.py \
            scripts/refresh_runtime_fallback_feeds.py \
            scripts/record_blocked_daily_data_health.py \
            scripts/build_daily_data_health.py \
            scripts/apply_daily_data_health_to_godview.py
      - name: Inventory sources
        run: python scripts/inventory_events_sources_v02.py
      - name: Rebuild exact official supplemental occurrences
        run: python scripts/refresh_official_supplemental_occurrences.py
      - name: Project discovery taxonomy
        run: python scripts/project_events_discovery_v02.py
      - name: Enforce strict source reconciliation
        run: python scripts/enforce_strict_discovery_reconciliation.py
      - name: Rebuild News Desk money and viral overlays
        run: python scripts/run_daily_people_facing_desk_sync.py --skip-network-sync
      - name: Rebuild emergency runtime fallback
        run: python scripts/refresh_runtime_fallback_feeds.py
      - name: Verify complete runtime families
        run: |
          python - <<'PY'
          import json
          major = json.load(open('data/schema-v1-discovery/major/events.json'))
          emergency = json.load(open('nycif_major_radar_map_events.json'))
          fallback = json.load(open('data/runtime_fallback_feed_report.json'))
          photographer = json.load(open('data/photographer_assignment_calendar_report.json'))
          viral = json.load(open('data/photographer_viral_recurrence_report.json'))
          major_rows = major.get('events', []) if isinstance(major, dict) else major
          assert major_rows and len(emergency) == len(major_rows)
          assert fallback.get('qa_pass') and fallback.get('duplicate_ids') == 0
          assert photographer.get('qa_pass')
          assert viral.get('qa_pass')
          print({'major': len(major_rows), 'emergency': len(emergency), 'money': photographer.get('total_events'), 'viral': viral.get('match_count')})
          PY
      - name: Discovery filter QA report
        run: python scripts/build_discovery_filter_qa_report.py
      - name: Build discovery God View digest
        run: python scripts/build_events_discovery_godview_digest_v02.py
      - name: Discovery contract tests
        run: python scripts/test_events_discovery_v02.py
      - name: Schema-v1 security still green
        run: python scripts/test_events_schema_v1_security.py
      - name: JavaScript syntax
        run: |
          node --check docs/field-desk-map-deploy/discovery-taxonomy-v02/discovery-patch-v02.js
          node --check docs/field-desk-map-deploy/discovery-taxonomy-v02/public-map-defaults-v01.js
          node --check docs/field-desk-map-deploy/discovery-taxonomy-v02/service-worker.js
          node --check docs/field-desk-map-deploy/discovery-taxonomy-v02/public-approved-overlays-v01.js
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/event-feed-schema-v1.js
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/app-schema-v1-major-all-v01.js
          node --check docs/field-desk-admin-deploy/admin/discovery-godview-panel-v02.js
          node --check docs/field-desk-admin-deploy/admin/daily-data-health-panel-v01.js
