name: Street Segment LION Geometry V4

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_geosupport_recovery_v2.py'
      - 'scripts/audit_street_segment_lion_geometry_v4.py'
      - 'tests/test_street_segment_geosupport_recovery_v2.py'
      - 'tests/test_street_segment_lion_geometry_v4.py'
      - '.github/workflows/street-segment-lion-geometry-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lion-segment-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEOSUPPORT_RUNTIME_IMAGE: 'nycplanning/docker-geosupport:26.2.0'
      LION_DATASET_URL: 'https://data.cityofnewyork.us/download/2v4z-66xt/application/zip'
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'no'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin unzip

      - name: Test V4 geometry audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_street_segment_lion_geometry_v4.py
          python3 -m unittest tests.test_street_segment_lion_geometry_v4 -v

      - name: Pull official NYC Planning GeoSupport runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$GEOSUPPORT_RUNTIME_IMAGE"
          docker run --rm "$GEOSUPPORT_RUNTIME_IMAGE" \
            python -c 'from geosupport import Geosupport; Geosupport(); print("NYCIF_GEOSUPPORT_IMPORT_OK=1")'

      - name: Rebuild strict non-public Segment Identifier evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-lion-v4
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e NYCIF_ALLOW_LIVE_GEOSEARCH=no \
            -e NYCIF_ALLOW_LIVE_GEOCLIENT=no \
            -e GEOSUPPORT_RUNTIME_IMAGE="$GEOSUPPORT_RUNTIME_IMAGE" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/nycif-lion-v4:/evidence \
            -w /workspace \
            "$GEOSUPPORT_RUNTIME_IMAGE" \
            python scripts/audit_street_segment_geosupport_recovery_v2.py \
              --output /evidence/street_segment_geosupport_recovery_audit_v2.json

      - name: Download official current LION package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/nycif-lion-v4/lion.zip \
            "$LION_DATASET_URL"
          unzip -q /tmp/nycif-lion-v4/lion.zip -d /tmp/nycif-lion-v4/lion-package
          echo 'NYCIF_LION_PACKAGE_TOP_LEVEL:'
          find /tmp/nycif-lion-v4/lion-package -maxdepth 2 \( -type f -o -type d \) | head -n 80

      - name: Discover official vector layer carrying SegmentID
        shell: bash
        run: |
          set -euo pipefail
          candidates=/tmp/nycif-lion-v4/layer-candidates.tsv
          : > "$candidates"

          while IFS= read -r shp; do
            layer="$(basename "$shp" .shp)"
            info="$(ogrinfo -ro -so "$shp" "$layer" 2>/dev/null || true)"
            if printf '%s\n' "$info" | grep -qiE '^[[:space:]]*SegmentID:' && printf '%s\n' "$info" | grep -qiE '^[[:space:]]*Geometry: (Line String|Multi Line String)'; then
              printf 'shp\t%s\t%s\n' "$shp" "$layer" >> "$candidates"
            fi
          done < <(find /tmp/nycif-lion-v4/lion-package -type f -iname '*.shp' | sort)

          while IFS= read -r gdb; do
            echo "NYCIF_GDB_LAYER_LIST=$gdb"
            ogrinfo -ro "$gdb" 2>/dev/null || true
            while IFS= read -r layer; do
              [ -n "$layer" ] || continue
              info="$(ogrinfo -ro -so "$gdb" "$layer" 2>/dev/null || true)"
              if printf '%s\n' "$info" | grep -qiE '^[[:space:]]*SegmentID:' && printf '%s\n' "$info" | grep -qiE '^[[:space:]]*Geometry: (Line String|Multi Line String)'; then
                printf 'gdb\t%s\t%s\n' "$gdb" "$layer" >> "$candidates"
              fi
            done < <(ogrinfo -ro "$gdb" 2>/dev/null | sed -n -E 's/^[[:space:]]*[0-9]+: (.*) \([^)]*\)$/\1/p')
          done < <(find /tmp/nycif-lion-v4/lion-package -type d -iname '*.gdb' | sort)

          cat "$candidates"
          count="$(wc -l < "$candidates" | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one line layer containing SegmentID; found $count" >&2
            exit 1
          fi
          IFS=$'\t' read -r kind source layer < "$candidates"
          echo "LION_SOURCE_KIND=$kind" >> "$GITHUB_ENV"
          echo "LION_SOURCE_PATH=$source" >> "$GITHUB_ENV"
          echo "LION_SOURCE_LAYER=$layer" >> "$GITHUB_ENV"
          echo "NYCIF_LION_SOURCE_KIND=$kind"
          echo "NYCIF_LION_SOURCE_PATH=$source"
          echo "NYCIF_LION_SOURCE_LAYER=$layer"

      - name: Extract only strict Segment Identifier geometries as GeoJSON
        shell: bash
        run: |
          set -euo pipefail
          where_clause="$(python3 - <<'PY'
          import json
          report = json.load(open('/tmp/nycif-lion-v4/street_segment_geosupport_recovery_audit_v2.json', encoding='utf-8'))
          ids = sorted({
              str(row.get('function_3_segment_identifier') or '').strip()
              for row in report.get('claims', [])
              if row.get('strict_nonpublic_segment_evidence') is True
          } - {''})
          if not ids:
              raise SystemExit('no strict Segment Identifiers available')
          escaped = [value.replace("'", "''") for value in ids]
          print('SegmentID IN (' + ','.join("'" + value + "'" for value in escaped) + ')')
          PY
          )"
          ogr2ogr \
            -f GeoJSON \
            -t_srs EPSG:4326 \
            -where "$where_clause" \
            /tmp/nycif-lion-v4/lion_strict_segments.geojson \
            "$LION_SOURCE_PATH" \
            "$LION_SOURCE_LAYER"

      - name: Join and audit official LION geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_street_segment_lion_geometry_v4.py \
            --identity-report /tmp/nycif-lion-v4/street_segment_geosupport_recovery_audit_v2.json \
            --lion-geojson /tmp/nycif-lion-v4/lion_strict_segments.geojson \
            --output /tmp/nycif-lion-v4/street_segment_lion_geometry_audit_v4.json

      - name: Prove V4 remains non-public and clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          path = '/tmp/nycif-lion-v4/street_segment_lion_geometry_audit_v4.json'
          report = json.load(open(path, encoding='utf-8'))
          assert report['read_only'] is True
          assert report['promotion_allowed'] is False
          assert report['publication_authority_granted'] is False
          assert report['public_renderer_enabled'] is False
          assert report['projector_consumed'] is False
          assert report['location_cache_modified'] is False
          assert report['public_map_modified'] is False
          assert report['point_generated_count'] == 0
          assert report['midpoint_publication_count'] == 0
          assert report['duplicate_joined_segment_identifier_count'] == 0
          assert all(value == 0 for value in report['hard_zero_gates'].values())
          PY
          test -z "$(git status --porcelain)"

      - name: Upload non-public LION geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-lion-v4-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nycif-lion-v4/street_segment_geosupport_recovery_audit_v2.json
            /tmp/nycif-lion-v4/lion_strict_segments.geojson
            /tmp/nycif-lion-v4/street_segment_lion_geometry_audit_v4.json
            /tmp/nycif-lion-v4/layer-candidates.tsv
          retention-days: 14
