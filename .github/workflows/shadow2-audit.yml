name: Enigma SHADOW-2 Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/shadow2-audit.yml'
      - 'scripts/apply_pr364_review_fixes.sh'

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/dpr-park-geometry-resolver
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          bash scripts/apply_pr364_review_fixes.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dpr): close PR 364 review gates"
          git push origin HEAD:feat/dpr-park-geometry-resolver
