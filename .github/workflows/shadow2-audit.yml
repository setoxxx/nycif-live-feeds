name: Enigma SHADOW-2 Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/shadow2-audit.yml'
      - 'nycif/normalize/park_geometry.py'
      - 'scripts/build_dpr_park_centroids.py'

permissions:
  contents: write

jobs:
  regenerate-dpr-lookup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/dpr-park-geometry-resolver
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate deterministic DPR lookup
        run: |
          python3 scripts/build_dpr_park_centroids.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/park_centroids.json data/park_centroids_ambiguous_aliases.json
          if git diff --cached --quiet; then
            echo "Lookup already current"
          else
            git commit -m "data(dpr): regenerate deterministic interior anchors"
            git push origin HEAD:feat/dpr-park-geometry-resolver
          fi
