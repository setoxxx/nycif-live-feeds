name: Temporary Production Verification Dispatch

on:
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch-production-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Discovery Feed Refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discovery-feed-refresh.yml --repo "${{ github.repository }}" --ref main

      - name: Remove this one-time dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/temporary-production-verification-dispatch.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
            -f message='Remove completed production verification dispatcher' \
            -f sha="$sha" \
            -f branch='main'
