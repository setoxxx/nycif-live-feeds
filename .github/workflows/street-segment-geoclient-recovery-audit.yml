name: Street Segment Geoclient Recovery Audit

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_geoclient_recovery.py'
      - 'tests/test_street_segment_geoclient_recovery_audit.py'
      - 'scripts/nyc_geoclient_client.py'
      - 'scripts/nyc_location_resolver.py'
      - '.github/workflows/street-segment-geoclient-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  street-segment-geoclient-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'yes'
      NYC_GEOCLIENT_APP_ID: ${{ secrets.NYC_GEOCLIENT_APP_ID }}
      NYC_GEOCLIENT_APP_KEY: ${{ secrets.NYC_GEOCLIENT_APP_KEY }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "${actual}" = "${expected}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile and test read-only audit
        run: |
          python3 -m py_compile scripts/audit_street_segment_geoclient_recovery.py
          python3 -m unittest tests.test_street_segment_geoclient_recovery_audit -v

      - name: Run authoritative street-segment recovery audit
        run: |
          mkdir -p /tmp/nycif-street-segment-audit
          python3 scripts/audit_street_segment_geoclient_recovery.py \
            --output /tmp/nycif-street-segment-audit/street_segment_geoclient_recovery_audit_v1.json

      - name: Prove audit stayed non-mutating
        run: test -z "$(git status --porcelain)"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-geoclient-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nycif-street-segment-audit
          retention-days: 14
