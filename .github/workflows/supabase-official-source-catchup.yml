name: Supabase Official Source Catch-up
run-name: Official city snapshots → event_occurrences @ ${{ github.sha }}

# Writes today's official tvpp / Parks / calendar snapshots into the staging
# event tables the iOS app reads. Does not expire rows, does not touch the
# location cache or public map feeds, and is not part of Discovery Feed Refresh.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Discovery Feed Refresh"]
    types: [completed]
  schedule:
    - cron: '30 18 * * 1-5'
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: supabase-official-source-catchup
  cancel-in-progress: false

jobs:
  catchup-official-events:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPABASE_WRITE_ENABLED: 'true'
      SUPABASE_TARGET_ENV: 'staging'
      SUPABASE_PROJECT_REF: 'oggwpvdirkrnzoolparx'
      SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Supabase service-role secret
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::SUPABASE_SERVICE_ROLE_KEY repository secret is missing.'
            exit 1
          fi

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Plan official catch-up
        run: |
          python3 scripts/sync_supabase_official_source_catchup.py --dataset all
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/supabase_official_source_catchup_report.json').read_text())
          if report.get('expire_enabled') is not False:
              raise SystemExit('catch-up must never expire')
          if report.get('database_write_performed') is not False:
              raise SystemExit('plan unexpectedly wrote')
          for key in ('location_cache_modified', 'staged_feed_modified', 'public_map_modified'):
              if report.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          datasets = report.get('datasets') or {}
          for name in ('tvpp-9vvx', 'nyc-parks-bigapps-events', 'nyc-citywide-events-calendar-api'):
              if int((datasets.get(name) or {}).get('rows', 0)) <= 0:
                  raise SystemExit(f'{name} official snapshot produced no rows')
          if int(datasets['tvpp-9vvx'].get('map_ready', 1)) != 0:
              raise SystemExit('tvpp street permits must stay list-only')
          print(json.dumps({k: {kk: vv for kk, vv in v.items() if kk != 'occurrence_ids'} for k, v in datasets.items()}, indent=2))
          PY

      - name: Write official snapshots through Rung 8
        run: |
          python3 scripts/sync_supabase_official_source_catchup.py --dataset all --write --chunk-size 80
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/supabase_official_source_catchup_report.json').read_text())
          if report.get('database_write_performed') is not True:
              raise SystemExit('official catch-up did not write')
          if report.get('expire_enabled') is not False:
              raise SystemExit('catch-up must never expire')
          actions = {}
          for block in (report.get('datasets') or {}).values():
              for key, value in (block.get('actions') or {}).items():
                  actions[key] = actions.get(key, 0) + int(value or 0)
          if int(actions.get('EXPIRE', 0)) != 0:
              raise SystemExit('official catch-up expired rows')
          print(json.dumps({'actions': actions, 'datasets': {k: {kk: vv for kk, vv in v.items() if kk != 'occurrence_ids'} for k, v in report['datasets'].items()}}, indent=2))
          PY
