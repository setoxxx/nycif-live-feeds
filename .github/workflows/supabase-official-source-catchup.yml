name: Supabase Official Source Catch-up
run-name: Official city snapshots → event_occurrences @ ${{ github.sha }}

# Daily factory for the iOS/Android event app (one master repo):
# 1) Discovery Feed Refresh pulls SODA/JSON links into GitHub snapshots at
#    6:00pm America/New_York (after the city's ~5-6pm cut).
# 2) This job PUSHES those snapshots into Supabase event_occurrences. It runs
#    after a successful Discovery, on a 7:00pm America/New_York backup clock,
#    and on manual dispatch. GitHub is the factory. Supabase does not poll
#    this repo. The phone reads Supabase only.
#
# Dataset rules stay separate: every public tvpp-9vvx street permit is pinned
# from Parks facilities / LION centerlines / Geoclient / NYC GeoSearch. Parks
# pins certify only with official in-bounds coordinates. Calendar stays
# list-only unless the snapshot already has official coords. Projected feast
# stays list-only.
#
# Does not expire rows, does not touch the location cache or public map feeds,
# and is not part of Discovery Feed Refresh.

on:
  workflow_dispatch:
  schedule:
    # Backup after Discovery's 6:00pm America/New_York pull. workflow_run is
    # still the primary trigger; this makes the phone refresh even if that
    # handoff is skipped.
    - cron: "0 19 * * *"
      timezone: "America/New_York"
  workflow_run:
    workflows: ["Discovery Feed Refresh"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: supabase-official-source-catchup
  cancel-in-progress: false

jobs:
  catchup-official-events:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPABASE_WRITE_ENABLED: 'true'
      SUPABASE_TARGET_ENV: 'staging'
      SUPABASE_PROJECT_REF: 'oggwpvdirkrnzoolparx'
      SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYC_GEOCLIENT_APP_ID: ${{ secrets.NYC_GEOCLIENT_APP_ID }}
      NYC_GEOCLIENT_APP_KEY: ${{ secrets.NYC_GEOCLIENT_APP_KEY }}
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'true'
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'true'
    steps:
      - name: Check out latest official snapshots
        uses: actions/checkout@v4
        with:
          # workflow_run's head SHA is Discovery's start commit, not the
          # snapshots Discovery just pushed. Schedule/workflow_run must
          # always push current main.
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule') && 'main' || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Supabase service-role secret
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::SUPABASE_SERVICE_ROLE_KEY repository secret is missing.'
            exit 1
          fi

      - name: Plan official catch-up
        run: |
          python3 -m py_compile scripts/sync_supabase_official_source_catchup.py scripts/official_event_contract.py scripts/official_daily_machine.py scripts/supabase_event_writer.py scripts/tvpp_pin_resolver.py
          python3 scripts/sync_supabase_official_source_catchup.py --dataset all
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/supabase_official_source_catchup_report.json').read_text())
          batch = json.loads(Path('data/reports/supabase_official_event_batch.json').read_text())
          listing = json.loads(Path('data/reports/supabase_official_today_listing.json').read_text())
          if report.get('expire_enabled') is not False:
              raise SystemExit('catch-up must never expire')
          if report.get('database_write_performed') is not False:
              raise SystemExit('plan unexpectedly wrote')
          for key in ('location_cache_modified', 'staged_feed_modified', 'public_map_modified'):
              if report.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          if batch.get('schema') != 'nycif_apply_staging_event_batch.v1':
              raise SystemExit('batch JSON is not the Rung 8 contract')
          if batch.get('p_allow_expire') is not False:
              raise SystemExit('batch JSON must never expire')
          if listing.get('schema') != 'event_reader_rolling_v1.today_overlap.v1':
              raise SystemExit('today listing JSON is not the reader contract')
          if int(listing.get('rows') or 0) <= 0:
              raise SystemExit('today listing produced no rows')
          datasets = report.get('datasets') or {}
          for name in (
              'tvpp-9vvx',
              'nyc-parks-bigapps-events',
              'nyc-citywide-events-calendar-api',
              'nyc-projected-feast-reference',
          ):
              if int((datasets.get(name) or {}).get('rows', 0)) <= 0:
                  raise SystemExit(f'{name} official snapshot produced no rows')
              if name not in (batch.get('datasets') or {}):
                  raise SystemExit(f'{name} missing from Rung 8 batch JSON')
          if int(datasets['tvpp-9vvx'].get('map_ready', 0)) != int(datasets['tvpp-9vvx'].get('rows', -1)):
              raise SystemExit('tvpp street permits must all be pinned')
          if int(datasets['nyc-projected-feast-reference'].get('map_ready', 1)) != 0:
              raise SystemExit('projected feast rows must stay list-only')
          if int((listing.get('by_dataset') or {}).get('tvpp-9vvx', {}).get('list_only', 1)) != 0:
              raise SystemExit('today listing must pin every tvpp street permit')
          if int((listing.get('by_dataset') or {}).get('nyc-projected-feast-reference', {}).get('map_ready', 1)) != 0:
              raise SystemExit('today listing must not pin projected feast rows')
          machine = json.loads(Path('data/reports/official_daily_machine_report.json').read_text())
          if machine.get('qa_pass') is not True:
              raise SystemExit(f"official daily machine failed: {machine.get('failures')}")
          if machine.get('expire_enabled') is not False:
              raise SystemExit('daily machine must never expire')
          if report.get('daily_machine', {}).get('qa_pass') is not True:
              raise SystemExit('catch-up report is missing a passing daily machine gate')
          today = {k: listing.get(k) for k in ('today_nyc', 'rows', 'map_ready', 'list_only', 'by_dataset')}
          print(json.dumps({'today': today, 'datasets': {k: {kk: vv for kk, vv in v.items() if kk != 'occurrence_ids'} for k, v in datasets.items()}}, indent=2))
          PY

      - name: Write official snapshots through Rung 8
        run: |
          python3 scripts/sync_supabase_official_source_catchup.py --dataset all --write --from-batch data/reports/supabase_official_event_batch.json --chunk-size 80
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/supabase_official_source_catchup_report.json').read_text())
          if report.get('database_write_performed') is not True:
              raise SystemExit('official catch-up did not write')
          if report.get('expire_enabled') is not False:
              raise SystemExit('catch-up must never expire')
          actions = {}
          for block in (report.get('datasets') or {}).values():
              for key, value in (block.get('actions') or {}).items():
                  actions[key] = actions.get(key, 0) + int(value or 0)
          if int(actions.get('EXPIRE', 0)) != 0:
              raise SystemExit('official catch-up expired rows')
          print(json.dumps({'actions': actions, 'today': report.get('today'), 'datasets': {k: {kk: vv for kk, vv in v.items() if kk != 'occurrence_ids'} for k, v in report['datasets'].items()}}, indent=2))
          PY
