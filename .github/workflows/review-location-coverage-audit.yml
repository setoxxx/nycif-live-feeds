name: Review Location Coverage Audit

on:
  pull_request:
    paths:
      - "scripts/audit_review_location_coverage.py"
      - "scripts/refine_review_location_coverage.py"
      - "scripts/refine_review_location_cross_source.py"
      - "scripts/run_review_location_cross_source.py"
      - "scripts/refine_review_locations_from_parks.py"
      - "scripts/resolve_review_locations_from_lion.py"
      - "scripts/resolve_review_locations_from_lion_nodes.py"
      - "scripts/resolve_remaining_review_locations.py"
      - "scripts/run_review_location_resolution_audit.py"
      - "tests/test_review_location_coverage.py"
      - "tests/test_refine_review_location_coverage.py"
      - "tests/test_refine_review_location_cross_source.py"
      - "tests/test_run_review_location_cross_source.py"
      - "tests/test_refine_review_locations_from_parks.py"
      - "tests/test_resolve_review_locations_from_lion.py"
      - "tests/test_resolve_review_locations_from_lion_nodes.py"
      - "tests/test_resolve_remaining_review_locations.py"
      - "tests/test_review_location_audit_runner.py"
      - "tests/test_review_location_street_segments.py"
      - ".github/workflows/review-location-coverage-audit.yml"
      - "data/schema-v1-discovery/approved/**"
      - "data/schema-v1-discovery/review/**"
      - "data/nyc_parks_bigapps_events_snapshot.json"
      - "data/nyc_location_gazetteer.json"
      - "data/nyc_geosearch_gazetteer_cache.json"
      - "data/supplemental_location_gazetteer_overlay.json"
  workflow_dispatch:
    inputs:
      expected_target_count:
        description: "Expected null or noncanonical borough review count"
        required: true
        default: "2426"
      allow_live_geosearch:
        description: "Type yes to allow temporary live NYC GeoSearch lookups"
        required: true
        default: "yes"

permissions:
  contents: read

concurrency:
  group: review-location-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run focused regression tests
        run: |
          python3 -m pytest -q \
            tests/test_review_location_coverage.py \
            tests/test_refine_review_location_coverage.py \
            tests/test_refine_review_location_cross_source.py \
            tests/test_run_review_location_cross_source.py \
            tests/test_refine_review_locations_from_parks.py \
            tests/test_resolve_review_locations_from_lion.py \
            tests/test_resolve_review_locations_from_lion_nodes.py \
            tests/test_resolve_remaining_review_locations.py \
            tests/test_review_location_audit_runner.py \
            tests/test_review_location_street_segments.py

      - name: Build baseline 2,426-record location audit
        env:
          EXPECTED_TARGET_COUNT: ${{ github.event.inputs.expected_target_count || '2426' }}
        shell: bash
        run: |
          python3 scripts/audit_review_location_coverage.py \
            --expected-target-count "$EXPECTED_TARGET_COUNT" \
            --report /tmp/review-location-coverage-baseline.json \
            --proposals /tmp/review-location-resolution-baseline.json

      - name: Refine from exact same-snapshot location evidence
        shell: bash
        run: |
          python3 scripts/refine_review_location_coverage.py \
            --base-report /tmp/review-location-coverage-baseline.json \
            --base-proposals /tmp/review-location-resolution-baseline.json \
            --report /tmp/review-location-coverage-refined.json \
            --proposals /tmp/review-location-resolution-refined.json

      - name: Download official NYC DCP borough boundaries
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.cityofnewyork.us/api/v3/views/gthc-hcne/query.geojson?accessType=DOWNLOAD' \
            --output /tmp/nyc-dcp-borough-boundaries.geojson
          test -s /tmp/nyc-dcp-borough-boundaries.geojson

      - name: Refine from official cross-source event counterparts
        shell: bash
        run: |
          python3 scripts/run_review_location_cross_source.py \
            --input-report /tmp/review-location-coverage-refined.json \
            --input-proposals /tmp/review-location-resolution-refined.json \
            --borough-boundaries /tmp/nyc-dcp-borough-boundaries.geojson \
            --report /tmp/review-location-coverage-cross-source.json \
            --proposals /tmp/review-location-resolution-cross-source.json

      - name: Resolve exact NYC Parks event counterparts
        shell: bash
        run: |
          python3 scripts/refine_review_locations_from_parks.py \
            --input-report /tmp/review-location-coverage-cross-source.json \
            --input-proposals /tmp/review-location-resolution-cross-source.json \
            --borough-boundaries /tmp/nyc-dcp-borough-boundaries.geojson \
            --report /tmp/review-location-coverage-parks.json \
            --proposals /tmp/review-location-resolution-parks.json

      - name: Resolve stated street segments from current official NYC LION nodes
        shell: bash
        run: |
          python3 scripts/resolve_review_locations_from_lion_nodes.py \
            --input-report /tmp/review-location-coverage-parks.json \
            --input-proposals /tmp/review-location-resolution-parks.json \
            --borough-boundaries /tmp/nyc-dcp-borough-boundaries.geojson \
            --report /tmp/review-location-coverage-lion.json \
            --proposals /tmp/review-location-resolution-lion.json

      - name: Resolve remaining physical locations with official boundaries
        env:
          ALLOW_LIVE_GEOSEARCH: ${{ github.event_name == 'pull_request' && 'yes' || github.event.inputs.allow_live_geosearch || 'no' }}
        shell: bash
        run: |
          args=(
            --input-report /tmp/review-location-coverage-lion.json
            --input-proposals /tmp/review-location-resolution-lion.json
            --borough-boundaries /tmp/nyc-dcp-borough-boundaries.geojson
            --report /tmp/review-location-coverage-audit.json
            --proposals /tmp/review-location-resolution-proposals.json
          )
          if test "$ALLOW_LIVE_GEOSEARCH" = "yes"; then
            args+=(--allow-live-geosearch)
          fi
          python3 scripts/run_review_location_resolution_audit.py "${args[@]}"

      - name: Enforce staging-only boundary
        env:
          EXPECTED_TARGET_COUNT: ${{ github.event.inputs.expected_target_count || '2426' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = int(os.environ['EXPECTED_TARGET_COUNT'])
          baseline = json.loads(Path('/tmp/review-location-coverage-baseline.json').read_text())
          refined = json.loads(Path('/tmp/review-location-coverage-refined.json').read_text())
          cross = json.loads(Path('/tmp/review-location-coverage-cross-source.json').read_text())
          parks = json.loads(Path('/tmp/review-location-coverage-parks.json').read_text())
          lion = json.loads(Path('/tmp/review-location-coverage-lion.json').read_text())
          report = json.loads(Path('/tmp/review-location-coverage-audit.json').read_text())
          proposals = json.loads(Path('/tmp/review-location-resolution-proposals.json').read_text())

          assert baseline['target_null_borough_count'] == expected
          assert report['qa_pass'] is True
          assert report['target_null_borough_count'] == expected
          assert report['accounted_count'] == expected
          assert report['location_classified_count'] == expected
          assert report['zero_silent_null_borough_records'] is True
          assert sum(report['disposition_counts'].values()) == expected
          assert proposals['target_count'] == expected
          assert len(proposals['proposals']) == expected

          assert refined['unresolved_count'] <= baseline['unresolved_count']
          assert cross['unresolved_count'] <= refined['unresolved_count']
          assert parks['unresolved_count'] <= cross['unresolved_count']
          assert lion['unresolved_count'] <= parks['unresolved_count']
          assert report['unresolved_count'] <= lion['unresolved_count']
          assert refined['refinement']['newly_resolved_count'] == (
            baseline['unresolved_count'] - refined['unresolved_count']
          )
          assert cross['cross_source_refinement']['newly_resolved_count'] == (
            refined['unresolved_count'] - cross['unresolved_count']
          )
          assert cross['cross_source_refinement']['official_boundary_coordinate_evidence'] is True
          assert parks['parks_counterpart_refinement']['newly_resolved_count'] == (
            cross['unresolved_count'] - parks['unresolved_count']
          )
          assert lion['lion_resolution']['newly_resolved_count'] == (
            parks['unresolved_count'] - lion['unresolved_count']
          )
          assert report['official_resolution']['newly_resolved_count'] == (
            lion['unresolved_count'] - report['unresolved_count']
          )
          assert report['allow_live_geosearch'] == report['official_resolution']['allow_live_geosearch']
          assert len(report['official_resolution']['borough_boundary_sha256']) == 64
          assert report['official_resolution']['borough_boundary_source_url'].startswith(
            'https://data.cityofnewyork.us/'
          )

          flyer_rows = [
            item for item in proposals['proposals']
            if 'please see the flyer' in str(item.get('location') or '').lower()
          ]
          assert flyer_rows
          assert all(item.get('disposition') == 'unresolved' for item in flyer_rows)
          assert all(item.get('pin_eligible') is False for item in flyer_rows)

          assert report['safety'] == {
            'location_cache_modified': False,
            'production_feed_modified': False,
            'promotion_allowed': False,
            'proposal_only': True,
            'public_map_modified': False,
            'wordpress_modified': False,
          }
          assert all(item.get('disposition') for item in proposals['proposals'])
          assert all(item.get('location_classified') is True for item in proposals['proposals'])
          assert all(item.get('promotion_allowed') is False for item in proposals['proposals'])
          assert all(item.get('public_map_modified') is False for item in proposals['proposals'])
          PY

      - name: Verify repository remains unchanged
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Upload protected audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-location-coverage-${{ github.sha }}
          path: |
            /tmp/review-location-coverage-baseline.json
            /tmp/review-location-resolution-baseline.json
            /tmp/review-location-coverage-refined.json
            /tmp/review-location-resolution-refined.json
            /tmp/review-location-coverage-cross-source.json
            /tmp/review-location-resolution-cross-source.json
            /tmp/review-location-coverage-parks.json
            /tmp/review-location-resolution-parks.json
            /tmp/review-location-coverage-lion.json
            /tmp/review-location-resolution-lion.json
            /tmp/review-location-coverage-audit.json
            /tmp/review-location-resolution-proposals.json
            /tmp/nyc-dcp-borough-boundaries.geojson
          if-no-files-found: warn
          retention-days: 7
