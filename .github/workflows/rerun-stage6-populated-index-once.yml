name: Rerun Stage 6 With Approved Index Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  audit:
    if: github.event.issue.title == 'RERUN STAGE 6 WITH APPROVED INDEX'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/stage-6-city-source-shadow-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic tests
        run: python -m unittest tests/test_stage6_city_source_audit.py
      - name: Run corrected live official-source shadow audit
        run: python scripts/audit_stage6_city_sources_fixed.py | tee /tmp/stage6.json
      - name: Verify populated approved occurrence index and no promotions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/stage6_city_source_shadow_audit.json').read_text())
          assert report['qa_pass'] is True, report
          assert report['status'] == 'PASS', report
          assert report['approved_events_indexed'] > 0, report
          assert report['source_count'] == 4, report
          assert report['production_feeds_modified'] is False, report
          assert all(source['production_promotion_allowed'] is False for source in report['sources']), report
          PY
      - name: Prove production feeds are unchanged
        run: |
          git diff --exit-code -- \
            data/schema-v1-discovery/approved \
            data/schema-v1-discovery/review \
            nycif_all_radar_map_events.json \
            nycif_major_radar_map_events.json
      - name: Commit corrected evidence
        id: commit
        run: |
          git add \
            data/reports/stage6_city_source_shadow_audit.json \
            data/reports/stage6_city_source_shadow_audit.md
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record Stage 6 audit with approved occurrence index [skip ci]'
            git push origin HEAD:feature/stage-6-city-source-shadow-audit
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          summary="$(python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/reports/stage6_city_source_shadow_audit.json').read_text())
          print(f"status: {report['status']}")
          print(f"approved events indexed: {report['approved_events_indexed']}")
          for source in report['sources']:
              print(f"{source['dataset_id']} | rows={source['row_count']} | future={source['current_future_count']} | source_overlap={source['approved_overlap_source_id_count']} | semantic_overlap={source['approved_overlap_semantic_count']} | {source['disposition']}")
          PY
          )"
          body=$(cat <<EOF
          Corrected Stage 6 shadow audit passed.

          - corrected evidence committed: ${CHANGED:-false}
          - production feeds modified: false
          - production promotions: zero

          \`\`\`
          ${summary}
          \`\`\`
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
      - name: Remove one-time runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/rerun-stage6-populated-index-once.yml
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/contents/${WORKFLOW_PATH}" \
              -f message='Remove completed corrected Stage 6 audit runner' \
              -f sha="$sha" \
              -f branch='main'
          fi
