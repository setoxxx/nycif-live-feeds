name: Culture civic weekly pull

# Weekly NYPD / FDNY / shelter ingest into culture_civic_facility_v1.
# Staging artifacts plus optional gated Supabase upsert. Does not flip
# reader gates, does not deploy edges, does not invent facilities.
#
# Schedule: Monday 6:00 AM America/New_York during EDT (UTC-4) = 10:00 UTC.
# GitHub Actions cron is UTC-only. During EST the same cron is 5:00 AM local.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Civic source. live = SODA. fixture = committed test rows."
        required: false
        default: "live"
        type: choice
        options:
          - live
          - fixture

permissions:
  contents: read

concurrency:
  group: culture-civic-weekly
  cancel-in-progress: false

jobs:
  civic-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Capture protected file fingerprints (pre)
        id: pre
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [
              "data/location_cache.json",
              "data/nycif_staged_live_events.json",
              "data/staged_live_manifest.json",
              "data/previous_staged_live_events_snapshot.json",
          ]
          out = {}
          for rel in paths:
              path = Path(rel)
              out[rel] = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
          Path("/tmp/culture_protected_pre.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Pull NYPD precincts
        run: |
          MODE="${{ github.event.inputs.source_mode || 'live' }}"
          if [ "$MODE" = "fixture" ]; then
            python3 scripts/culture/pull_nypd_precincts.py \
              --fixture tests/fixtures/culture/nypd_precincts.fixture.json
            exit 0
          fi
          set +e
          python3 scripts/culture/pull_nypd_precincts.py --live
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
            echo "NYPD live pull unavailable (exit $rc); staging fixture rows, inventing nothing"
            python3 scripts/culture/pull_nypd_precincts.py \
              --fixture tests/fixtures/culture/nypd_precincts.fixture.json
            exit 0
          fi
          echo "NYPD unexpected exit $rc" >&2
          exit "$rc"

      - name: Pull FDNY firehouses
        run: |
          MODE="${{ github.event.inputs.source_mode || 'live' }}"
          if [ "$MODE" = "fixture" ]; then
            python3 scripts/culture/pull_fdny_firehouses.py \
              --fixture tests/fixtures/culture/fdny_firehouses.fixture.json
            exit 0
          fi
          set +e
          python3 scripts/culture/pull_fdny_firehouses.py --live
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
            echo "FDNY live pull unavailable (exit $rc); staging fixture rows, inventing nothing"
            python3 scripts/culture/pull_fdny_firehouses.py \
              --fixture tests/fixtures/culture/fdny_firehouses.fixture.json
            exit 0
          fi
          echo "FDNY unexpected exit $rc" >&2
          exit "$rc"

      - name: Pull shelters (inspect addressability)
        run: |
          MODE="${{ github.event.inputs.source_mode || 'live' }}"
          if [ "$MODE" = "fixture" ]; then
            python3 scripts/culture/pull_shelters.py \
              --fixture tests/fixtures/culture/shelters_census_only.fixture.json
            exit 0
          fi
          set +e
          python3 scripts/culture/pull_shelters.py --live
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
            echo "Shelter live pull unavailable (exit $rc); staging census fixture, inventing nothing"
            python3 scripts/culture/pull_shelters.py \
              --fixture tests/fixtures/culture/shelters_census_only.fixture.json
            exit 0
          fi
          echo "Shelter unexpected exit $rc" >&2
          exit "$rc"

      - name: Validate before publish (fail-closed)
        if: always()
        run: python3 scripts/culture/validate_before_publish.py

      - name: Enforce publication_allowed stays false
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data/culture/reports/validate_before_publish.json")
          if not path.exists():
              print("missing data/culture/reports/validate_before_publish.json")
              sys.exit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("publication_allowed") is not False:
              print("publication_allowed must stay false")
              sys.exit(1)
          if report.get("would_publish") is True:
              print("would_publish must stay false")
              sys.exit(1)
          print("Fail-closed: publication stays off.")
          PY

      - name: Load civic staging into gated Supabase tables
        env:
          SUPABASE_URL: "https://oggwpvdirkrnzoolparx.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY missing; skipping live table load"
            exit 0
          fi
          python3 scripts/culture/load_calendar_civic_staging.py --dataset civic --write
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("data/culture/reports/calendar_civic_load_report.json").read_text(encoding="utf-8"))
          print(
              f"applied={report.get('applied')} civic={report.get('civic_row_count')} "
              f"gates_touched={report.get('gates_touched')} "
              f"settings_after_enabled={report.get('settings_after_enabled')}"
          )
          if report.get("gates_touched") is True:
              print("loader must not touch reader gates")
              sys.exit(1)
          if report.get("publication_allowed") is True or report.get("would_publish") is True:
              print("load report must stay unpublished")
              sys.exit(1)
          if report.get("settings_after_enabled"):
              print("reader gates must stay false after load", report.get("settings_after_enabled"))
              sys.exit(1)
          print("Gates were not written. Civic staging loaded behind the gate.")
          PY

      - name: Enforce protected files untouched
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          pre = json.loads(Path("/tmp/culture_protected_pre.json").read_text(encoding="utf-8"))
          bad = []
          for rel, before in pre.items():
              path = Path(rel)
              after = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if before != after:
                  bad.append(rel)
          if bad:
              print("PROTECTED FILES CHANGED:", bad)
              sys.exit(1)
          print("Protected files untouched.")
          PY

      - name: Upload Culture civic staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-civic-staging
          if-no-files-found: warn
          retention-days: 7
          path: |
            data/culture/staging/*.json
            data/culture/reports/*.json
