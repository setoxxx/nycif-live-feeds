name: Daily Refresh Reliability Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/discovery-feed-refresh.yml'
      - '.github/workflows/daily-refresh-reliability-check.yml'
      - 'scripts/run_discovery_feed_refresh.sh'
      - 'scripts/publish_blocked_daily_refresh.sh'
      - 'scripts/run_daily_refresh_stage.py'
      - 'scripts/record_blocked_daily_data_health.py'
      - 'scripts/test_live_event_intake_refresh_current.py'
      - 'scripts/test_live_event_intake_refresh.py'
      - 'scripts/test_daily_production_hardening.py'
      - 'data/reports/event_923896_snapshot_recovery_certificate.json'

permissions:
  contents: read

jobs:
  reliability-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate shell entrypoints
        run: |
          bash -n scripts/run_discovery_feed_refresh.sh
          bash -n scripts/publish_blocked_daily_refresh.sh

      - name: Compile reliability scripts
        run: |
          python -m py_compile \
            scripts/run_daily_refresh_stage.py \
            scripts/record_blocked_daily_data_health.py \
            scripts/test_live_event_intake_refresh_current.py \
            scripts/test_daily_production_hardening.py

      - name: Run date-safe live intake regressions
        run: python scripts/test_live_event_intake_refresh_current.py

      - name: Run refresh hardening regressions
        run: python scripts/test_daily_production_hardening.py
