name: Events Supabase Authority CI

on:
  pull_request:
    paths:
      - 'scripts/supabase_event_writer.py'
      - 'scripts/sync_supabase_event_authority.py'
      - 'scripts/supabase_dataset_sync_fastpath.py'
      - 'scripts/sync_supabase_event_authority_all.py'
      - 'scripts/build_maplibre_reader_safe_v03.py'
      - 'enigma/shadow2/occurrence_identity.py'
      - 'tests/test_supabase_event_writer.py'
      - 'tests/test_supabase_event_authority_sync.py'
      - 'tests/test_supabase_dataset_sync_fastpath.py'
      - 'tests/test_supabase_event_authority_all.py'
      - 'tests/test_p0_event_reader_visibility.py'
      - 'tests/test_enigma_shadow2/test_occurrence_identity.py'
      - 'data/events_discovery_accepted_canonical_v02.json'
      - 'supabase/migrations/20260819162000_rung8_dataset_scoped_expiration.sql'
      - 'supabase/migrations/20260819165000_event_dataset_membership_finalize.sql'
      - 'supabase/migrations/20260819170500_reader_safe_events_rpc.sql'
      - '.github/workflows/events-supabase-authority-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile authority scripts
        run: |
          python3 -m py_compile \
            scripts/supabase_event_writer.py \
            scripts/sync_supabase_event_authority.py \
            scripts/supabase_dataset_sync_fastpath.py \
            scripts/sync_supabase_event_authority_all.py \
            scripts/build_maplibre_reader_safe_v03.py \
            enigma/shadow2/occurrence_identity.py

      - name: Run Supabase writer guard tests
        run: python3 -m pytest tests/test_supabase_event_writer.py -q

      - name: Run dataset-scoped authority sync regressions
        run: python3 -m unittest tests.test_supabase_event_authority_sync -v

      - name: Run exact-membership finalizer fast-path regressions
        run: python3 -m unittest tests.test_supabase_dataset_sync_fastpath -v

      - name: Run all-datasets authority orchestration regressions
        run: python3 -m unittest tests.test_supabase_event_authority_all -v

      - name: Run reader Today+7 regressions
        run: python3 -m unittest tests.test_p0_event_reader_visibility -v

      - name: Run OccurrenceIdentityV2 regressions
        run: python3 -m unittest tests.test_enigma_shadow2.test_occurrence_identity -v

      - name: Run full canonical authority dry run
        run: |
          python3 scripts/sync_supabase_event_authority_all.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --chunk-size 500 \
            > /tmp/nycif-all-datasets-dry-run.json
          cat /tmp/nycif-all-datasets-dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/nycif-all-datasets-dry-run.json').read_text())
          if result.get('database_write_performed') is not False:
              raise SystemExit('dry run unexpectedly performed a database write')
          if int(result.get('dataset_count', 0)) <= 1:
              raise SystemExit('canonical authority unexpectedly collapsed to one source dataset')
          if int(result.get('input_count', 0)) <= 0:
              raise SystemExit('dry run returned an empty canonical corpus')
          if int(result.get('reader_metadata_rows', 0)) != int(result.get('input_count', 0)):
              raise SystemExit('reader metadata does not cover the full canonical corpus')
          PY
