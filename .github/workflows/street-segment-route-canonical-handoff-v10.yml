name: Street Segment Route Canonical Handoff V10

on:
  pull_request:
    paths:
      - 'scripts/audit_street_segment_route_canonical_handoff_v10.py'
      - 'tests/test_street_segment_route_canonical_handoff_v10.py'
      - '.github/workflows/street-segment-route-canonical-handoff-v10.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonical-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V9_ARTIFACT_ID: '9220999563'
      V9_ARTIFACT_SHA256: 'eac9b8846bb4e950b8069505e19f38951df47a7acca3d496f503376c642b873f'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test V10 handoff audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_street_segment_route_canonical_handoff_v10.py
          python3 -m unittest tests.test_street_segment_route_canonical_handoff_v10 -v

      - name: Download frozen V9 evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-route-v10/v9
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V9_ARTIFACT_ID}/zip" \
            -o /tmp/nycif-route-v10/v9.zip
          actual="$(sha256sum /tmp/nycif-route-v10/v9.zip | awk '{print $1}')"
          echo "NYCIF_V9_ARTIFACT_SHA256=${actual}"
          test "$actual" = "$V9_ARTIFACT_SHA256"
          unzip -q /tmp/nycif-route-v10/v9.zip -d /tmp/nycif-route-v10/v9
          test -f /tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json

      - name: Audit canonical occurrence handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_street_segment_route_canonical_handoff_v10.py \
            --v9-registry /tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json \
            --canonical data/events_discovery_accepted_canonical_v02.json \
            --output /tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json

      - name: Prove V10 remains non-public and read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json'))
          assert report['handoff_conformance_pass'] is True
          assert report['input_v9_occurrence_count']==90
          assert report['canonical_handoff_certified_count']==90
          assert report['publication_authority_granted'] is False
          assert report['public_renderer_enabled'] is False
          assert report['projector_consumed'] is False
          assert report['promotion_allowed'] is False
          assert report['canonical_modified'] is False
          assert report['reader_safe_modified'] is False
          assert report['release_status']=='NONPUBLIC_EVIDENCE_ONLY'
          assert all(value==0 for value in report['hard_zero_gates'].values())
          PY
          test -z "$(git status --porcelain)"

      - name: Upload V10 non-public handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-route-canonical-handoff-v10-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json
          retention-days: 14
