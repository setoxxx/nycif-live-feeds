name: Street Segment Route Canonical Handoff V10

on:
  pull_request:
    paths:
      - 'scripts/occurrence_identity_contract.py'
      - 'scripts/test_occurrence_identity_contract.py'
      - 'scripts/audit_street_segment_route_canonical_handoff_v10.py'
      - 'scripts/diagnose_street_segment_route_canonical_handoff_v10.py'
      - 'tests/test_street_segment_route_canonical_handoff_v10.py'
      - '.github/workflows/street-segment-route-canonical-handoff-v10.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonical-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V9_ARTIFACT_ID: '9221766364'
      V9_ARTIFACT_SHA256: 'e2d65417ed01f9b20ac2854de21d87aa0ab27ba0f6e3140e1009c5ad9c67cd39'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      NYCIF_ALLOW_LIVE_GEOSEARCH: 'no'
      NYCIF_ALLOW_LIVE_GEOCLIENT: 'no'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NYCIF_EXPECTED_HEAD=${expected}"
          echo "NYCIF_CHECKED_OUT_HEAD=${actual}"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test occurrence identity and V10 handoff contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/occurrence_identity_contract.py
          python3 -m py_compile scripts/audit_street_segment_route_canonical_handoff_v10.py
          python3 -m py_compile scripts/diagnose_street_segment_route_canonical_handoff_v10.py
          python3 scripts/test_occurrence_identity_contract.py
          python3 -m unittest tests.test_street_segment_route_canonical_handoff_v10 -v

      - name: Download frozen V9 evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-route-v10/v9
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V9_ARTIFACT_ID}/zip" \
            -o /tmp/nycif-route-v10/v9.zip
          actual="$(sha256sum /tmp/nycif-route-v10/v9.zip | awk '{print $1}')"
          echo "NYCIF_V9_ARTIFACT_SHA256=${actual}"
          test "$actual" = "$V9_ARTIFACT_SHA256"
          unzip -q /tmp/nycif-route-v10/v9.zip -d /tmp/nycif-route-v10/v9
          test -f /tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json

      - name: Prove V9 occurrences exist in current checked-in raw snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from scripts.occurrence_identity_contract import occurrence_key_v2, identity_precision
          v9=json.load(open('/tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json'))
          raw=json.load(open('data/raw_nyc_open_data_snapshot.json'))
          targets={tuple(row['occurrence_key_v2']) for row in v9['registry']}
          raw_keys={occurrence_key_v2(row) for row in raw if identity_precision(row) != 'AMBIGUOUS'}
          assert len(targets)==90
          assert len(targets & raw_keys)==90
          print('NYCIF_V10_RAW_MATCHED_KEYS=90')
          PY

      - name: Rebuild current canonical in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nycif-route-v10/projector
          original_sha="$(sha256sum data/events_discovery_accepted_canonical_v02.json | awk '{print $1}')"
          echo "NYCIF_ORIGINAL_CANONICAL_SHA256=${original_sha}" >> "$GITHUB_ENV"
          cp -a . /tmp/nycif-route-v10/projector/repo
          cd /tmp/nycif-route-v10/projector/repo
          export PYTHONPATH="$PWD:$PWD/scripts"
          python3 scripts/project_events_discovery_v03.py
          test -s data/events_discovery_accepted_canonical_v02.json

      - name: Diagnose corrected projector treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/diagnose_street_segment_route_canonical_handoff_v10.py \
            --v9-registry /tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json \
            --raw /tmp/nycif-route-v10/projector/repo/data/raw_nyc_open_data_snapshot.json \
            --staged /tmp/nycif-route-v10/projector/repo/data/nycif_staged_live_events.json \
            --supplemental /tmp/nycif-route-v10/projector/repo/data/supplemental_events_staging_feed.json \
            --dispositions /tmp/nycif-route-v10/projector/repo/data/row_disposition_events.json \
            --canonical /tmp/nycif-route-v10/projector/repo/data/events_discovery_accepted_canonical_v02.json \
            --season-start 2026-07-14 --season-end 2026-12-27 \
            --output /tmp/nycif-route-v10/street_segment_route_canonical_handoff_diagnostic_v10.json

      - name: Audit corrected canonical occurrence handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_street_segment_route_canonical_handoff_v10.py \
            --v9-registry /tmp/nycif-route-v10/v9/street_segment_route_occurrence_registry_v9.json \
            --canonical /tmp/nycif-route-v10/projector/repo/data/events_discovery_accepted_canonical_v02.json \
            --output /tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json'))
          assert r['handoff_conformance_pass'] is True
          assert r['input_v9_occurrence_count']==90
          assert r['canonical_handoff_certified_count']==90
          assert r['publication_authority_granted'] is False
          assert r['public_renderer_enabled'] is False
          assert r['projector_consumed'] is False
          assert r['promotion_allowed'] is False
          assert r['canonical_modified'] is False
          assert r['reader_safe_modified'] is False
          assert r['release_status']=='NONPUBLIC_EVIDENCE_ONLY'
          assert all(value==0 for value in r['hard_zero_gates'].values())
          PY

      - name: Prove source workspace unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum data/events_discovery_accepted_canonical_v02.json | awk '{print $1}')" = "$NYCIF_ORIGINAL_CANONICAL_SHA256"
          test -z "$(git status --porcelain)"

      - name: Upload V10 non-public handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-segment-route-canonical-handoff-v10-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nycif-route-v10/street_segment_route_canonical_handoff_diagnostic_v10.json
            /tmp/nycif-route-v10/street_segment_route_canonical_handoff_audit_v10.json
          retention-days: 14
