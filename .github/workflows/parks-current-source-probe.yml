name: Parks Current Source Probe

on:
  pull_request:
    paths:
      - '.github/workflows/parks-current-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official NYC Parks current-events dataset
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          urls = [
              'https://data.cityofnewyork.us/resource/w3wp-dpdi.json?$limit=3',
              'https://data.cityofnewyork.us/api/views/w3wp-dpdi/rows.json?accessType=DOWNLOAD',
          ]
          headers = {'Accept': 'application/json', 'User-Agent': 'NYCIF-live-feeds/2.0 (+https://nycinfocus.com/)'}
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if isinstance(payload, list):
                      rows = payload
                  elif isinstance(payload, dict):
                      rows = payload.get('data') or payload.get('rows') or payload.get('items') or []
                  else:
                      rows = []
                  print(json.dumps({
                      'url': url,
                      'payload_type': type(payload).__name__,
                      'row_count': len(rows) if isinstance(rows, list) else None,
                      'first_row_type': type(rows[0]).__name__ if isinstance(rows, list) and rows else None,
                      'first_row_keys': sorted(rows[0].keys()) if isinstance(rows, list) and rows and isinstance(rows[0], dict) else None,
                      'first_row': rows[0] if isinstance(rows, list) and rows and isinstance(rows[0], dict) else None,
                  }, default=str))
              except Exception as exc:
                  print(json.dumps({'url': url, 'error': str(exc)}))
          PY