name: NYCIF Supabase Bootstrap Certification
run-name: NYCIF Supabase Bootstrap Certification @ ${{ github.event_name }}-${{ github.run_id }}

# Temporary, one-shot certification runner for issue #440.
# It exists on main only so the approved bootstrap can run without merging PR
# #441 first. Remove this workflow and its trigger file after evidence is captured.
#
# Operational lesson: a fresh NYC Open Data refresh can contain additions,
# removals, modifications, and unchanged rows at the same time. A net row-count
# decrease does NOT mean no new data arrived. Certification must process the full
# fresh corpus and let dataset-scoped membership/finalization distinguish present
# versus absent source rows without hard-deleting event history.

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - '.github/nycif-supabase-bootstrap-trigger-main'

permissions:
  contents: read
  issues: write

concurrency:
  group: nycif-supabase-bootstrap-certification
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 440 &&
       github.event.comment.body == '/nycif-supabase-bootstrap-certify-20260819')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_WRITE_ENABLED: 'true'
      SUPABASE_TARGET_ENV: 'staging'
      SUPABASE_PROJECT_REF: 'oggwpvdirkrnzoolparx'
      SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out approved certification branch
        uses: actions/checkout@v4
        with:
          ref: fix/events-dataset-expiration-20260819

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Supabase service-role secret
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::SUPABASE_SERVICE_ROLE_KEY repository secret is missing.'
            exit 1
          fi

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Preflight authority regressions
        run: |
          python3 -m py_compile \
            scripts/supabase_event_writer.py \
            scripts/sync_supabase_official_source_catchup.py \
            scripts/sync_supabase_event_authority.py \
            enigma/shadow2/occurrence_identity.py \
            scripts/live_event_intake_refresh.py \
            scripts/project_events_discovery_v03.py \
            scripts/enforce_strict_discovery_reconciliation.py
          python3 -m pytest tests/test_supabase_event_writer.py tests/test_supabase_official_source_catchup.py -q
          python3 -m unittest tests.test_supabase_event_authority_sync -v
          python3 -m unittest tests.test_enigma_shadow2.test_occurrence_identity -v

      - name: Capture checked-in source baseline
        run: cp data/raw_nyc_open_data_snapshot.json /tmp/nycif-pre-refresh-raw.json

      - name: Refresh live sources and rebuild canonical authority candidate
        run: |
          python3 scripts/live_event_intake_refresh.py
          python3 scripts/refresh_official_supplemental_occurrences.py
          python3 scripts/build_events_schema_v1_major.py
          python3 scripts/build_street_festivals_feed.py
          python3 scripts/project_events_discovery_v03.py
          python3 scripts/enforce_strict_discovery_reconciliation.py

      - name: Certify fresh NYC Open Data intake and V3 reconciliation
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          with urllib.request.urlopen('https://data.cityofnewyork.us/api/views/tvpp-9vvx', timeout=60) as response:
              metadata = json.load(response)

          metadata_rows = None
          for column in metadata.get('columns') or []:
              if column.get('fieldName') == 'event_id':
                  cached = column.get('cachedContents') or {}
                  raw_count = cached.get('count') or cached.get('non_null')
                  if raw_count not in (None, ''):
                      metadata_rows = int(raw_count)
                  break

          rows_updated_at = metadata.get('rowsUpdatedAt')
          rows_updated_iso = None
          if isinstance(rows_updated_at, (int, float)):
              rows_updated_iso = datetime.fromtimestamp(rows_updated_at, timezone.utc).isoformat()

          before = json.loads(Path('/tmp/nycif-pre-refresh-raw.json').read_text())
          current = json.loads(Path('data/raw_nyc_open_data_snapshot.json').read_text())
          live = json.loads(Path('data/live_sync_report.json').read_text())
          reconciliation = json.loads(Path('data/events_discovery_reconciliation_v02.json').read_text())
          v3 = json.loads(Path('data/events_discovery_v3_authority_report.json').read_text())

          if not isinstance(current, list) or not current:
              raise SystemExit('fresh NYC Open Data snapshot is empty')
          if int(live.get('raw_rows_loaded', -1)) != len(current):
              raise SystemExit('live sync raw_rows_loaded does not match fresh raw snapshot')
          if metadata_rows is not None and metadata_rows != len(current):
              raise SystemExit(f'NYC Open Data metadata count {metadata_rows} != fetched raw snapshot {len(current)}')
          if reconciliation.get('reconciles_strict') is not True:
              raise SystemExit('fresh source strict reconciliation failed')
          if v3.get('qa_pass') is not True or v3.get('raw_accounting_pass') is not True:
              raise SystemExit('fresh source Projector V3 authority gate failed')

          payload = {
              'dataset': 'tvpp-9vvx',
              'metadata_name': metadata.get('name'),
              'metadata_rows': metadata_rows,
              'rows_updated_at_epoch': rows_updated_at,
              'rows_updated_at_utc': rows_updated_iso,
              'previous_checked_in_raw_rows': len(before) if isinstance(before, list) else None,
              'fresh_raw_rows': len(current),
              'raw_snapshot_content_changed': digest('/tmp/nycif-pre-refresh-raw.json') != digest('data/raw_nyc_open_data_snapshot.json'),
              'live_sync_generated_at_utc': live.get('generated_at_utc'),
              'current_future_rows': live.get('current_future_rows'),
              'v3_accepted_records': v3.get('accepted_records'),
              'v3_qa_pass': v3.get('qa_pass'),
              'strict_reconciliation': reconciliation.get('reconciles_strict'),
          }
          Path('/tmp/nycif-live-source-refresh.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Reconfirm bounded canonical dry run from fresh source
        run: |
          python3 scripts/sync_supabase_event_authority.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --dataset tvpp-9vvx \
            --chunk-size 500 \
            > /tmp/nycif-tvpp-dry-run.json
          cat /tmp/nycif-tvpp-dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/nycif-tvpp-dry-run.json').read_text())
          expected = int(result.get('input_count', 0))
          if result.get('database_write_performed') is not False:
              raise SystemExit('dry run unexpectedly performed a database write')
          if expected <= 0:
              raise SystemExit('fresh canonical corpus is empty')
          if int(result.get('chunk_size', 0)) != 500:
              raise SystemExit('dry run chunk size drifted from 500')
          expected_chunks = (expected + 499) // 500
          if int(result.get('chunk_count', 0)) != expected_chunks:
              raise SystemExit('dry run chunk count does not match fresh canonical corpus')
          if int(result.get('reader_metadata_rows', 0)) != expected:
              raise SystemExit('reader metadata does not cover the fresh canonical corpus')
          PY

      - name: Bootstrap full TVPP authority from fresh canonical corpus
        run: |
          python3 scripts/sync_supabase_event_authority.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --dataset tvpp-9vvx \
            --chunk-size 500 \
            --write \
            > /tmp/nycif-tvpp-bootstrap-first.json
          cat /tmp/nycif-tvpp-bootstrap-first.json

      - name: Prove immediate identical rerun is idempotent
        run: |
          python3 scripts/sync_supabase_event_authority.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --dataset tvpp-9vvx \
            --chunk-size 500 \
            --write \
            > /tmp/nycif-tvpp-bootstrap-second.json
          cat /tmp/nycif-tvpp-bootstrap-second.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          dry = json.loads(Path('/tmp/nycif-tvpp-dry-run.json').read_text())
          first = json.loads(Path('/tmp/nycif-tvpp-bootstrap-first.json').read_text())
          second = json.loads(Path('/tmp/nycif-tvpp-bootstrap-second.json').read_text())
          expected = int(dry['input_count'])

          for label, result in (('first', first), ('second', second)):
              if result.get('database_write_performed') is not True:
                  raise SystemExit(f'{label} live sync did not report a database write')
              if int(result.get('input_count', 0)) != expected:
                  raise SystemExit(f'{label} live sync input count differs from dry run')
              if int(result.get('membership_staged_count', 0)) != expected:
                  raise SystemExit(f'{label} live sync did not finalize complete membership')

          actions = second.get('actions') or {}
          for action in ('INSERT', 'UPDATE', 'EXPIRE'):
              if int(actions.get(action, 0) or 0) != 0:
                  raise SystemExit(f'idempotence failed: second {action}={actions.get(action)}')
          if int(second.get('source_rows_inactivated', 0) or 0) != 0:
              raise SystemExit('idempotence failed: second run inactivated source rows')
          if int(second.get('quality_changes', 0) or 0) != 0:
              raise SystemExit('idempotence failed: second run changed quality rows')
          if int(second.get('classification_changes', 0) or 0) != 0:
              raise SystemExit('idempotence failed: second run changed classifications')

          print('NYCIF_SUPABASE_BOOTSTRAP_CERTIFICATION=PASS')
          print(f'canonical_occurrences={expected}')
          print(f'first_actions={first.get("actions")}')
          print(f'second_actions={second.get("actions")}')
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nycif-supabase-bootstrap-certification
          path: |
            /tmp/nycif-live-source-refresh.json
            /tmp/nycif-tvpp-dry-run.json
            /tmp/nycif-tvpp-bootstrap-first.json
            /tmp/nycif-tvpp-bootstrap-second.json
          if-no-files-found: warn
          retention-days: 14

      - name: Post certification outcome to issue 440
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def read_json(path):
              p = Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception as exc:
                  return {'read_error': str(exc)}

          source = read_json('/tmp/nycif-live-source-refresh.json')
          dry = read_json('/tmp/nycif-tvpp-dry-run.json')
          first = read_json('/tmp/nycif-tvpp-bootstrap-first.json')
          second = read_json('/tmp/nycif-tvpp-bootstrap-second.json')
          status = os.environ.get('JOB_STATUS', 'unknown')
          lines = [
              '## NYCIF Supabase bootstrap certification result',
              '',
              f'Workflow status: **{status.upper()}**',
              f'Run: {os.environ.get("RUN_URL", "UNSPECIFIED")}',
              '',
          ]
          for label, payload in (
              ('Fresh NYC Open Data intake', source),
              ('Dry run', dry),
              ('First live sync', first),
              ('Immediate identical rerun', second),
          ):
              lines.append(f'### {label}')
              if payload is None:
                  lines.append('No result file was produced.')
              else:
                  lines.append('```json')
                  lines.append(json.dumps(payload, indent=2, sort_keys=True))
                  lines.append('```')
              lines.append('')
          Path('/tmp/nycif-bootstrap-comment.md').write_text('\n'.join(lines))
          PY
          gh issue comment 440 --repo setoxxx/nycif-live-feeds --body-file /tmp/nycif-bootstrap-comment.md
