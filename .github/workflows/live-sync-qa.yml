name: NYCIF Live Sync QA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  live-sync-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build location cache
        run: python scripts/build_location_cache.py

      - name: Run backend QA sync
        run: python scripts/sync_nyc_open_data.py

      - name: Build test enriched feed
        run: python scripts/build_test_enriched_feed.py

      - name: Build staged production feed
        run: python scripts/build_staged_production_feed.py

      - name: Build live delta report
        run: python scripts/build_live_delta_report.py

      - name: Audit feed anomalies
        run: python scripts/audit_feed_anomalies.py

      - name: Commit QA artifacts
        run: |
          git config user.name "github-actions[bot]"
          git add data/location_cache.json data/raw_nyc_open_data_snapshot.json data/live_sync_report.json data/nycif_live_test_enriched_events.json data/test_enriched_feed_manifest.json data/nycif_staged_live_events.json data/staged_live_manifest.json data/live_delta_report.json data/previous_staged_live_events_snapshot.json data/feed_anomaly_report.json
          if git diff --cached --quiet; then
            echo "No QA artifact changes to commit."
          else
            git commit -m "Update NYC Open Data live QA artifacts"
            git push
          fi
