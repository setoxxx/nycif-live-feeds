name: NYCIF Live Sync QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-sync-qa.yml'
      - 'scripts/**'
      - 'data/location_cache.json'
      - 'nycif_all_radar_map_events.json'
      - 'nycif_major_radar_map_events.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: nycif-live-sync-qa
  cancel-in-progress: false

jobs:
  live-sync-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build location cache
        run: python scripts/build_location_cache.py

      - name: Run backend QA sync
        run: python scripts/sync_nyc_open_data.py

      - name: Build test enriched feed
        run: python scripts/build_test_enriched_feed.py

      - name: Build staged production feed
        run: python scripts/build_staged_production_feed.py

      - name: Build GPS repository
        run: python scripts/build_gps_repository.py

      - name: Build GPS review groups
        run: python scripts/build_gps_review_groups.py

      - name: Build GPS geocoding proposals
        run: python scripts/build_gps_geocoding_proposals.py

      - name: Build GPS filled geocoding proposals
        run: python scripts/build_gps_geocoding_filled_proposals.py

      - name: Build GPS manual approval queue
        run: python scripts/build_gps_manual_approval_queue.py

      - name: Build GPS manual review sheet
        run: python scripts/build_gps_manual_review_sheet.py

      - name: Validate GPS manual approvals
        run: python scripts/validate_gps_manual_approvals.py

      - name: Build live delta report
        run: python scripts/build_live_delta_report.py

      - name: Build remainder-year coverage report
        run: python scripts/audit_remainder_year_coverage.py

      - name: Build row disposition QA report
        run: python scripts/audit_row_disposition.py

      - name: Build backend reliability gate report
        run: python scripts/backend_reliability_gate.py || echo "BACKEND_GATE_FAILED=true" >> "$GITHUB_ENV"

      - name: Email live delta report
        run: python scripts/send_live_delta_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_MAX_EVENTS: ${{ secrets.REPORT_MAX_EVENTS }}

      - name: Audit feed anomalies
        run: python scripts/audit_feed_anomalies.py

      - name: Commit QA artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/location_cache.json data/gps_repository_report.json data/gps_needs_review_events.json data/gps_review_group_report.json data/gps_review_location_groups.json data/gps_review_geocoding_queue.json data/gps_review_geocoding_proposals.json data/gps_review_geocoding_proposal_report.json data/gps_review_geocoding_filled_proposals.json data/gps_review_geocoding_fill_report.json data/gps_manual_approval_queue.json data/gps_manual_approval_queue_report.json data/gps_manual_approval_validation_report.json data/gps_manual_approval_review_sheet.json data/gps_manual_approval_review_sheet.csv data/gps_manual_approval_review_sheet_report.json data/raw_nyc_open_data_snapshot.json data/live_sync_report.json data/nycif_live_test_enriched_events.json data/test_enriched_feed_manifest.json data/nycif_staged_live_events.json data/staged_live_manifest.json data/live_delta_report.json data/previous_staged_live_events_snapshot.json data/feed_anomaly_report.json data/remainder_year_coverage_report.json data/row_disposition_report.json data/row_disposition_events.json data/backend_reliability_gate_report.json
          if git diff --cached --quiet; then
            echo "No QA artifact changes to commit."
          else
            git commit -m "Update NYC Open Data live QA artifacts"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Enforce backend reliability gate
        if: env.BACKEND_GATE_FAILED == 'true'
        run: |
          echo "Backend reliability gate failed. Review data/backend_reliability_gate_report.json."
          exit 1
