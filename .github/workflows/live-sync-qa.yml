name: NYCIF Live Sync QA

on:
  workflow_dispatch:
    inputs:
      allow_live_fetch:
        description: "Type yes to allow live NYC Open Data fetch and local QA artifact generation"
        required: true
        default: "no"
      allow_email:
        description: "Type yes to allow sending the live delta email"
        required: true
        default: "no"

permissions:
  contents: read

concurrency:
  group: nycif-live-sync-qa
  cancel-in-progress: false

jobs:
  live-sync-qa:
    if: github.event.inputs.allow_live_fetch == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Use committed data/location_cache.json (includes Phase 2E master GPS keys).
      # Do not run build_location_cache.py here — it rebuilds from enriched feed only
      # and would drop promoted keys during this QA run.

      - name: Run backend QA sync
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: "yes"
        run: python scripts/sync_nyc_open_data.py

      - name: Build test enriched feed
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: "yes"
        run: python scripts/build_test_enriched_feed.py

      - name: Build staged production feed
        run: python scripts/build_staged_production_feed.py

      - name: Build GPS repository
        run: python scripts/build_gps_repository.py

      - name: Build GPS review groups
        run: python scripts/build_gps_review_groups.py

      - name: Build GPS geocoding proposals
        run: python scripts/build_gps_geocoding_proposals.py

      - name: Build GPS filled geocoding proposals
        run: python scripts/build_gps_geocoding_filled_proposals.py

      - name: Build GPS unfilled review report
        run: python scripts/build_gps_unfilled_review_report.py

      - name: Validate committed GPS manual approval queue
        run: python scripts/validate_gps_manual_approvals.py

      - name: Build live delta report
        run: python scripts/build_live_delta_report.py

      - name: Build remainder-year coverage report
        run: python scripts/audit_remainder_year_coverage.py

      - name: Build row disposition QA report
        run: python scripts/audit_row_disposition.py

      - name: Sync citywide events calendar (staging)
        run: python scripts/sync_nyc_citywide_events_calendar.py

      - name: Sync NYC Parks BigApps events (staging)
        run: python scripts/sync_nyc_parks_bigapps_events.py

      - name: Build NYC Parks facility reference (staging)
        run: python scripts/build_nyc_parks_facility_reference.py

      - name: Build NYC location gazetteer
        run: python scripts/build_nyc_location_gazetteer.py

      - name: Build location resolver report
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: "yes"
        run: python scripts/build_location_resolver_report.py

      - name: Audit multi-source coverage
        run: python scripts/audit_multi_source_coverage.py

      - name: Build supplemental coverage review queues
        run: python scripts/build_supplemental_coverage_review_queues.py

      - name: Build supplemental location memory from approved queue (M11)
        run: python scripts/build_supplemental_location_memory.py

      - name: Build supplemental events staging feed
        run: python scripts/build_supplemental_events_staging_feed.py

      - name: Apply supplemental location memory to staging intake
        run: python scripts/apply_supplemental_location_memory.py

      - name: Validate supplemental manual approvals (M11)
        run: python scripts/validate_supplemental_manual_approvals.py

      - name: Incremental supplemental intake (M11)
        run: python scripts/incremental_supplemental_intake.py

      - name: Validate supplemental manual approvals after incremental intake
        run: python scripts/validate_supplemental_manual_approvals.py

      - name: Net-new supplemental review when pending rows exist (M11)
        env:
          NYCIF_ALLOW_LIVE_GEOSEARCH: "yes"
        run: |
          pending=$(python3 -c "import json; from pathlib import Path; q=json.loads(Path('data/supplemental_manual_approval_queue.json').read_text()); print(sum(1 for r in q.get('approval_queue', []) if str(r.get('manual_review_status', '')).lower() == 'pending'))")
          if [ "$pending" -gt 0 ]; then
            python3 scripts/apply_supplemental_net_new_live_sync_review.py
            python3 scripts/validate_supplemental_manual_approvals.py
            python3 scripts/build_supplemental_location_memory.py
          else
            echo "No pending supplemental rows; skipping net-new review."
          fi

      - name: Publish supplemental approved export for field-desk preview
        run: |
          python3 scripts/build_supplemental_approved_export_feed.py
          python3 scripts/build_nypd_precinct_boundaries_reference.py
          python3 scripts/build_supplemental_cultural_anniversary_staging.py
          python3 scripts/build_supplemental_press_geofence_staging.py
          python3 scripts/publish_supplemental_approved_export_feed.py

      - name: Supplemental Phase 2E promotion dry-run (M11)
        run: python3 scripts/dry_run_supplemental_phase2e_promotion.py

      - name: Enforce supplemental Phase 2E readiness gate
        run: python3 scripts/verify_supplemental_phase2e_readiness.py

      - name: Build supplemental manual review sheet (M11)
        run: python scripts/build_supplemental_manual_review_sheet.py

      - name: Build public map feeds from test enriched
        run: python scripts/build_public_map_feeds.py

      - name: Project schema-v1 consumer feeds
        run: python scripts/project_events_schema_v1.py

      - name: Build schema-v1 major events feed
        run: python scripts/build_events_schema_v1_major.py

      - name: Build schema-v1 page shards
        run: python scripts/build_events_schema_v1_pages.py

      - name: Audit schema-v1 categories
        run: python scripts/audit_events_schema_v1_categories.py

      - name: Full schema-v1 audit
        run: python scripts/audit_events_schema_v1_full.py

      - name: Test schema-v1 pipeline contract
        run: python scripts/test_events_schema_v1_pipeline.py

      - name: Test schema-v1 security rendering
        run: python scripts/test_events_schema_v1_security.py

      - name: JavaScript syntax checks for schema-v1 viewer
        run: |
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/event-feed-schema-v1.js
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/app-schema-v1-major-all-v01.js
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/service-worker.js
          node --check docs/field-desk-map-deploy/schema-v1-major-all-v01/public-map-defaults-v01.js

      - name: Build coverage gap review findings
        run: python scripts/build_coverage_gap_review_findings.py

      - name: Generate live pipeline dashboard status
        run: python scripts/generate_live_pipeline_dashboard_status.py

      - name: Generate God View project state
        run: python scripts/generate_godview_project_state.py --fetch-github

      - name: Build backend reliability gate report
        run: python scripts/backend_reliability_gate.py || echo "BACKEND_GATE_FAILED=true" >> "$GITHUB_ENV"

      - name: Email live delta report
        if: github.event.inputs.allow_email == 'yes' && env.BACKEND_GATE_FAILED != 'true'
        run: python scripts/send_live_delta_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_MAX_EVENTS: ${{ secrets.REPORT_MAX_EVENTS }}

      - name: Audit feed anomalies
        run: python scripts/audit_feed_anomalies.py

      - name: Enforce backend reliability gate
        if: env.BACKEND_GATE_FAILED == 'true'
        run: |
          echo "Backend reliability gate failed. Review data/backend_reliability_gate_report.json."
          exit 1
