name: ADR-0013 Approximate Marker Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adr0013-approximate-audit.yml'
      - 'scripts/build_approximate_municipality_stacks.py'
      - 'tests/test_build_approximate_municipality_stacks.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adr-0013-approximate-markers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and commit ADR-0013 GeoJSON
        run: |
          python3 scripts/build_approximate_municipality_stacks.py
          python3 -m unittest tests.test_build_approximate_municipality_stacks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schema-v1-discovery/approximate/approximate-stacks.json
          git commit -m "data(adr-0013): add approximate event GeoJSON"
          git push origin HEAD:feat/adr-0013-approximate-markers
