name: Occurrence Identity Enforcement Audit

on:
  pull_request:
    paths:
      - 'scripts/occurrence_identity_contract.py'
      - 'scripts/test_occurrence_identity_contract.py'
      - 'tests/test_occurrence_identity_contract.py'
      - 'scripts/audit_occurrence_identity_enforcement.py'
      - 'scripts/verify_occurrence_identity_runtime_audit.py'
      - '.github/workflows/occurrence-identity-enforcement-audit.yml'
      - 'scripts/project_events_discovery_v02.py'
      - 'data/source_lineage_registry_v01.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occurrence-identity-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occurrence-identity-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Record exact audit SHA
        run: echo "AUDIT_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused occurrence identity tests
        run: |
          python scripts/test_occurrence_identity_contract.py
          python -m unittest tests.test_occurrence_identity_contract -v

      - name: Produce protected historical/current occurrence audit evidence
        run: |
          set +e
          python scripts/audit_occurrence_identity_enforcement.py
          historical_status=$?
          set -e
          test -f /tmp/occurrence-identity-enforcement/occurrence_identity_enforcement_summary.json
          echo "historical_audit_exit_status=$historical_status"

      - name: Verify current-runtime occurrence identity acceptance criteria
        run: python scripts/verify_occurrence_identity_runtime_audit.py

      - name: Protected source-lineage contract check
        run: |
          python scripts/audit_source_lineage_contract.py \
            --out-dir /tmp/source-lineage-contract-check
          cp /tmp/source-lineage-contract-check/source_lineage_registry_audit_summary.json \
            /tmp/occurrence-identity-enforcement/source_lineage_contract_audit_summary.json

      - name: Project discovery in isolated temp copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path.cwd().resolve()
          destination = Path('/tmp/discovery-work').resolve()
          if destination.exists():
              shutil.rmtree(destination)

          def ignore_unneeded(path, names):
              ignored = {'.git', '__pycache__', '.pytest_cache', '.mypy_cache'}
              return ignored.intersection(names)

          shutil.copytree(source, destination, ignore=ignore_unneeded, symlinks=False)
          PY
          cd /tmp/discovery-work
          python scripts/project_events_discovery_v02.py
          python scripts/test_events_discovery_v02.py

      - name: Verify checkout stayed clean
        run: test -z "$(git status --porcelain)"

      - name: Verify protected summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/occurrence-identity-enforcement/occurrence_identity_enforcement_summary.json').read_text())
          gate = json.loads(Path('/tmp/occurrence-identity-enforcement/current_runtime_occurrence_identity_gate.json').read_text())
          assert gate['qa_pass'] is True, gate
          assert gate['computed_after_hidden_count'] == 0, gate
          assert summary['after_open_data_in_window_hidden_by_source_id'] == 0, summary
          assert summary['duplicate_canonical_id_count'] == 0, summary
          assert summary['raw_disposition_accounting_pass'] is True, summary
          assert summary['source_lineage_contract_compliance_pass'] is True, summary
          assert summary['launch_readiness'] is False, summary
          safety = summary['safety']
          assert safety['production_feed_modified'] is False
          assert safety['data_location_cache_json_modified'] is False
          assert safety['wordpress_modified'] is False
          assert safety['public_map_modified'] is False
          assert safety['homepage_modified'] is False
          assert safety['navigation_modified'] is False
          assert safety['theme_modified'] is False
          assert safety['approval_state_modified'] is False
          assert safety['promotion_allowed'] is False
          assert safety['proposal_only'] is True
          assert safety['public_launch_authorized'] is False
          PY

      - name: Upload protected occurrence identity artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: occurrence-identity-enforcement-${{ env.AUDIT_SOURCE_SHA }}
          path: /tmp/occurrence-identity-enforcement
          retention-days: 7
