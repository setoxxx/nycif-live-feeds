name: Run Stage 7 Production Refresh V2 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-stage7-production-refresh-v2-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  refresh-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger the atomic Discovery Feed Refresh
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="$(gh run list --workflow discovery-feed-refresh.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run discovery-feed-refresh.yml --ref main
          run_id=''
          for attempt in $(seq 1 90); do
            sleep 5
            run_id="$(gh run list --workflow discovery-feed-refresh.yml --event workflow_dispatch --limit 10 --json databaseId,status --jq '[.[] | select(.databaseId != '"$before"')][0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${{ github.repository }}/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
      - name: Wait for the atomic production transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: gh run watch "$RUN_ID" --exit-status
      - name: Read committed post-refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Certify exact-one Event 923896 map/list parity
        run: |
          python - <<'PY' | tee /tmp/stage7-certificate.json
          import json
          import re
          from pathlib import Path

          EVENT_ID = '923896'
          REQUIRED_DATE = '2026-08-01'

          def load(path, default=None):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return default

          def rows(payload):
              if isinstance(payload, list):
                  return [row for row in payload if isinstance(row, dict)]
              if isinstance(payload, dict):
                  for key in ('events', 'items', 'records'):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return [row for row in value if isinstance(row, dict)]
              return []

          def source_id(event):
              source = event.get('source') if isinstance(event.get('source'), dict) else {}
              return str(event.get('source_event_id') or source.get('source_event_id') or source.get('event_id') or '').strip()

          def normalized(value):
              return re.sub(r'[^a-z0-9]+', ' ', str(value or '').lower()).strip()

          def inspect(event, surface):
              start = event.get('start_date') or event.get('start_date_time') or event.get('start')
              borough = event.get('borough')
              location = event.get('display_location') or event.get('location') or event.get('address') or ''
              if isinstance(location, dict):
                  location = ' '.join(str(location.get(key) or '') for key in ('name','display_name','address','street','description'))
              raw_location = event.get('location') if isinstance(event.get('location'), dict) else {}
              lat = event.get('latitude', event.get('lat', raw_location.get('latitude', raw_location.get('lat'))))
              lng = event.get('longitude', event.get('lng', raw_location.get('longitude', raw_location.get('lng', raw_location.get('lon')))))
              try:
                  lat, lng = float(lat), float(lng)
              except (TypeError, ValueError):
                  lat, lng = None, None
              nycif = event.get('nycif') if isinstance(event.get('nycif'), dict) else {}
              coordinate_status = event.get('coordinate_status') or nycif.get('coordinate_status')
              failures=[]
              if not str(start or '').startswith(REQUIRED_DATE): failures.append(f'{surface}: wrong date {start!r}')
              if normalized(borough) != 'brooklyn': failures.append(f'{surface}: wrong borough {borough!r}')
              location_norm=normalized(location)
              for token in ('east 74 street','avenue u','avenue t'):
                  if token not in location_norm: failures.append(f'{surface}: missing {token!r}')
              if lat is None or lng is None: failures.append(f'{surface}: missing coordinates')
              else:
                  if not 40.60 <= lat <= 40.64: failures.append(f'{surface}: latitude {lat}')
                  if not -73.93 <= lng <= -73.88: failures.append(f'{surface}: longitude {lng}')
              if coordinate_status and str(coordinate_status).lower() != 'map_ready': failures.append(f'{surface}: coordinate status {coordinate_status!r}')
              return {'surface':surface,'event_id':event.get('id'),'start':start,'borough':borough,'location':location,'latitude':lat,'longitude':lng,'coordinate_status':coordinate_status,'failures':failures}

          page_matches=[]
          for page in sorted(Path('data/schema-v1-discovery/approved/pages').glob('page-*.json')):
              for event in rows(load(page, {})):
                  if source_id(event) == EVENT_ID: page_matches.append((page.name,event))
          list_matches=[event for event in rows(load('data/events_discovery_v02_approved.json', {})) if source_id(event) == EVENT_ID]
          health=load('status/nycif-daily-data-health.json', {}) or {}
          reconciliation=load('data/events_discovery_reconciliation_v02.json', {}) or {}
          health_event=(((health.get('required_event_checks') or {}).get('event_923896')) or {})
          failures=[]
          if len(page_matches) != 1: failures.append(f'map occurrence count={len(page_matches)}')
          if len(list_matches) != 1: failures.append(f'list occurrence count={len(list_matches)}')
          page_check=inspect(page_matches[0][1], f'approved page {page_matches[0][0]}') if page_matches else None
          list_check=inspect(list_matches[0], 'approved list export') if list_matches else None
          for check in (page_check,list_check):
              if check: failures.extend(check['failures'])
          if health.get('status') != 'READY' or health.get('release_ready') is not True: failures.append(f"health={health.get('status')!r}")
          if health.get('schema_version') != '1.4.0': failures.append(f"health schema={health.get('schema_version')!r}")
          if health_event.get('qa_pass') is not True or int(health_event.get('match_count') or 0) != 1: failures.append('health event certificate failed')
          if reconciliation.get('reconciles_strict') is not True: failures.append('strict reconciliation failed')
          certificate={
              'artifact_type':'nycif_stage7_completion_certificate',
              'qa_pass':not failures,
              'failures':failures,
              'source_event_id':EVENT_ID,
              'approved_page_match_count':len(page_matches),
              'approved_list_match_count':len(list_matches),
              'approved_page':page_matches[0][0] if len(page_matches)==1 else None,
              'page_check':page_check,
              'list_check':list_check,
              'health_status':health.get('status'),
              'health_schema_version':health.get('schema_version'),
              'health_event_check':health_event,
              'strict_reconciliation':reconciliation.get('reconciles_strict'),
              'approved_manifest_total':(load('data/schema-v1-discovery/approved/manifest.json', {}) or {}).get('total'),
          }
          print(json.dumps(certificate,indent=2,sort_keys=True))
          if failures: raise SystemExit(1)
          PY
      - name: Report completion to Issue 350
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
        run: |
          cert="$(cat /tmp/stage7-certificate.json)"
          gh issue comment 350 --repo "${{ github.repository }}" --body "Stage 7 production refresh and exact-occurrence certification passed.\n\n- Atomic refresh: ${RUN_URL}\n- Event 923896 map occurrences: 1\n- Event 923896 list occurrences: 1\n- Daily health: READY under schema 1.4.0\n- Strict reconciliation: passed\n\n\`\`\`json\n${cert}\n\`\`\`"
          gh issue close 350 --repo "${{ github.repository }}" --reason completed
      - name: Remove Stage 7 one-time runners
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in \
            .github/workflows/run-stage7-production-refresh-once.yml \
            .github/workflows/run-stage7-production-refresh-v2-once.yml; do
            sha="$(gh api "repos/${{ github.repository }}/contents/${workflow}?ref=main" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/${{ github.repository }}/contents/${workflow}" \
                -f message='Remove completed Stage 7 production runners' \
                -f sha="$sha" \
                -f branch='main'
            fi
          done
