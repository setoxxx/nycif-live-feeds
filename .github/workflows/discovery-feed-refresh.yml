name: Discovery Feed Refresh
run-name: Discovery Feed Refresh @ ${{ github.sha }}

# Atomic daily production transaction for the NYC In Focus News Desk.
# The repository-owned transaction script records an actionable stage and safe
# command identifier before every executable phase. Failed transactions publish
# only BLOCKED operator health; partial public feed JSON is discarded.
#
# While PR #441 is open, a manual dispatch of the certification branch OR a
# branch push that changes the authority implementation runs the Supabase
# bootstrap/idempotence + reader-parity gate instead of the production refresh.
# Scheduled and main-branch runs keep the normal production behavior.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
  push:
    branches:
      - main
      - fix/events-dataset-expiration-20260819
    paths:
      - '.github/workflows/discovery-feed-refresh.yml'
      - '.github/nycif-supabase-bootstrap-trigger'
      - 'scripts/run_discovery_feed_refresh.sh'
      - 'scripts/prepare_v3_runtime_validator.py'
      - 'tests/test_prepare_v3_runtime_validator.py'
      - 'scripts/sync_supabase_event_authority.py'
      - 'scripts/supabase_dataset_sync_fastpath.py'
      - 'scripts/sync_supabase_event_authority_all.py'
      - 'tests/test_supabase_dataset_sync_fastpath.py'
      - 'tests/test_supabase_event_authority_all.py'
      - 'scripts/supabase_event_writer.py'
      - 'supabase/migrations/20260826035000_optimize_event_source_dataset_finalizer_membership.sql'
      - 'scripts/publish_blocked_daily_refresh.sh'
      - 'scripts/run_daily_refresh_stage.py'
      - 'scripts/test_live_event_intake_refresh_current.py'
      - 'scripts/live_event_intake_refresh.py'
      - 'scripts/sync_nyc_open_data.py'
      - 'scripts/sync_nyc_citywide_events_calendar.py'
      - 'scripts/sync_nyc_parks_bigapps_events.py'
      - 'scripts/build_staged_production_feed.py'
      - 'scripts/refresh_official_supplemental_occurrences.py'
      - 'scripts/enforce_strict_discovery_reconciliation.py'
      - 'scripts/refresh_runtime_fallback_feeds.py'
      - 'scripts/record_blocked_daily_data_health.py'
      - 'scripts/check_field_desk_overlay_health.py'
      - 'scripts/build_daily_data_health.py'
      - 'scripts/apply_daily_data_health_to_godview.py'
      - 'scripts/test_daily_production_hardening.py'

permissions:
  contents: write

concurrency:
  group: discovery-feed-refresh
  cancel-in-progress: true

jobs:
  supabase-bootstrap-certification:
    if: github.ref_name == 'fix/events-dataset-expiration-20260819' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SUPABASE_WRITE_ENABLED: 'true'
      SUPABASE_TARGET_ENV: 'staging'
      SUPABASE_PROJECT_REF: 'oggwpvdirkrnzoolparx'
      SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out certification branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Preflight authority regressions
        run: |
          python3 -m py_compile \
            scripts/supabase_event_writer.py \
            scripts/sync_supabase_event_authority.py \
            scripts/supabase_dataset_sync_fastpath.py \
            scripts/sync_supabase_event_authority_all.py \
            scripts/project_events_discovery_v03.py \
            scripts/build_maplibre_reader_safe_v03.py \
            enigma/shadow2/occurrence_identity.py
          python3 -m pytest tests/test_supabase_event_writer.py -q
          python3 -m unittest tests.test_supabase_event_authority_sync -v
          python3 -m unittest tests.test_supabase_dataset_sync_fastpath -v
          python3 -m unittest tests.test_supabase_event_authority_all -v
          python3 -m unittest tests.test_enigma_shadow2.test_occurrence_identity -v

      - name: Rebuild fresh Projector V3 authority for certification
        run: |
          python3 scripts/project_events_discovery_v03.py
          python3 scripts/enforce_strict_discovery_reconciliation.py
          python3 scripts/build_maplibre_reader_safe_v03.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('data/reader-safe/national-map-events-v03-status.json').read_text())
          canonical = json.loads(Path('data/events_discovery_accepted_canonical_v02.json').read_text())
          events = canonical.get('events', canonical) if isinstance(canonical, dict) else canonical
          if not isinstance(events, list) or not events:
              raise SystemExit('fresh Projector V3 canonical corpus is empty')
          exact = int(status.get('exact_marker_count', 0) or 0)
          if status.get('qa_pass') is not True:
              raise SystemExit(f'fresh MapLibre V3 status failed QA: {status}')
          if status.get('authority') != 'projector_v3_semantic_map_decision':
              raise SystemExit(f'unexpected fresh V3 authority: {status.get("authority")!r}')
          if exact < 1000:
              raise SystemExit(f'fresh V3 corpus has too few certified markers: {exact}')
          map_ready = 0
          for event in events:
              nycif = event.get('nycif') if isinstance(event, dict) and isinstance(event.get('nycif'), dict) else {}
              if nycif.get('map_eligibility_state') == 'MAP_READY' and nycif.get('certified_pin') is True:
                  map_ready += 1
          if map_ready != exact:
              raise SystemExit(f'canonical/map reader marker mismatch: canonical={map_ready} reader={exact}')
          print(f'FRESH_V3_CERTIFICATION_CORPUS=PASS events={len(events)} exact_markers={exact}')
          PY

      - name: Reconfirm bounded full-corpus dry run
        run: |
          python3 scripts/sync_supabase_event_authority_all.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --chunk-size 500 \
            > /tmp/nycif-all-datasets-dry-run.json
          cat /tmp/nycif-all-datasets-dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/nycif-all-datasets-dry-run.json').read_text())
          if result.get('database_write_performed') is not False:
              raise SystemExit('dry run unexpectedly performed a database write')
          if int(result.get('dataset_count', 0)) <= 1:
              raise SystemExit('canonical authority unexpectedly collapsed to one source dataset')
          if int(result.get('input_count', 0)) <= 0:
              raise SystemExit('dry run returned an empty canonical corpus')
          if int(result.get('reader_metadata_rows', 0)) != int(result.get('input_count', 0)):
              raise SystemExit('reader metadata does not cover the full canonical corpus')
          PY

      - name: Bootstrap full canonical authority
        run: |
          python3 scripts/sync_supabase_event_authority_all.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --chunk-size 500 \
            --write \
            > /tmp/nycif-all-datasets-bootstrap-first.json
          cat /tmp/nycif-all-datasets-bootstrap-first.json

      - name: Prove immediate identical rerun is idempotent
        run: |
          python3 scripts/sync_supabase_event_authority_all.py \
            --input data/events_discovery_accepted_canonical_v02.json \
            --chunk-size 500 \
            --write \
            > /tmp/nycif-all-datasets-bootstrap-second.json
          cat /tmp/nycif-all-datasets-bootstrap-second.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          dry = json.loads(Path('/tmp/nycif-all-datasets-dry-run.json').read_text())
          first = json.loads(Path('/tmp/nycif-all-datasets-bootstrap-first.json').read_text())
          second = json.loads(Path('/tmp/nycif-all-datasets-bootstrap-second.json').read_text())
          expected = int(dry['input_count'])
          expected_datasets = int(dry['dataset_count'])

          for label, result in (('first', first), ('second', second)):
              if result.get('database_write_performed') is not True:
                  raise SystemExit(f'{label} live sync did not report a database write')
              if int(result.get('input_count', 0)) != expected:
                  raise SystemExit(f'{label} live sync input count differs from dry run')
              if int(result.get('dataset_count', 0)) != expected_datasets:
                  raise SystemExit(f'{label} live sync dataset count differs from dry run')
              per_dataset = result.get('results') or []
              if len(per_dataset) != expected_datasets:
                  raise SystemExit(f'{label} live sync omitted a source dataset')
              for dataset_result in per_dataset:
                  if int(dataset_result.get('membership_staged_count', 0)) != int(dataset_result.get('input_count', 0)):
                      raise SystemExit(f'{label} live sync did not finalize complete membership for {dataset_result.get("dataset")}')

          actions = second.get('actions') or {}
          for action in ('INSERT', 'UPDATE', 'EXPIRE'):
              if int(actions.get(action, 0) or 0) != 0:
                  raise SystemExit(f'idempotence failed: second {action}={actions.get(action)}')
          for dataset_result in second.get('results') or []:
              if int(dataset_result.get('source_rows_inactivated', 0) or 0) != 0:
                  raise SystemExit(f'idempotence failed: second run inactivated rows for {dataset_result.get("dataset")}')
              if int(dataset_result.get('quality_changes', 0) or 0) != 0:
                  raise SystemExit(f'idempotence failed: second run changed quality for {dataset_result.get("dataset")}')
              if int(dataset_result.get('classification_changes', 0) or 0) != 0:
                  raise SystemExit(f'idempotence failed: second run changed classifications for {dataset_result.get("dataset")}')

          print('NYCIF_SUPABASE_BOOTSTRAP_CERTIFICATION=PASS')
          print(f'canonical_occurrences={expected}')
          print(f'dataset_count={expected_datasets}')
          print(f'first_actions={first.get("actions")}')
          print(f'second_actions={second.get("actions")}')
          PY

      - name: Require Supabase reader marker parity
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_min_exact_markers":1000}' \
            "$SUPABASE_URL/rest/v1/rpc/nycif_reader_parity_report_v1" \
            > /tmp/nycif-reader-parity-report.json
          cat /tmp/nycif-reader-parity-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/nycif-reader-parity-report.json').read_text())
          if result.get('parity_gate_pass') is not True:
              raise SystemExit(f'Supabase reader parity gate is not green: {result}')
          if result.get('event_data_origin') != 'supabase_only':
              raise SystemExit(f'wrong reader authority: {result.get("event_data_origin")!r}')
          exact = result.get('reader_exact_marker_count', result.get('exact_marker_count', 0))
          if int(exact or 0) < 1000:
              raise SystemExit(f'exact marker floor not met: {exact}')
          PY

      - name: Write certification summary
        if: always()
        run: |
          {
            echo '## NYCIF Supabase bootstrap certification'
            echo
            for file in \
              /tmp/nycif-all-datasets-dry-run.json \
              /tmp/nycif-all-datasets-bootstrap-first.json \
              /tmp/nycif-all-datasets-bootstrap-second.json \
              /tmp/nycif-reader-parity-report.json; do
              if [ -f "$file" ]; then
                echo "### $(basename "$file")"
                echo '```json'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nycif-supabase-bootstrap-certification
          path: |
            /tmp/nycif-all-datasets-dry-run.json
            /tmp/nycif-all-datasets-bootstrap-first.json
            /tmp/nycif-all-datasets-bootstrap-second.json
            /tmp/nycif-reader-parity-report.json
          if-no-files-found: warn
          retention-days: 14

  refresh-discovery-feed:
    if: github.ref_name != 'fix/events-dataset-expiration-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guarded V3 runtime validation
        run: |
          python -m py_compile scripts/prepare_v3_runtime_validator.py
          python -m unittest tests.test_prepare_v3_runtime_validator -v
          python scripts/prepare_v3_runtime_validator.py \
            --source scripts/run_discovery_feed_refresh.sh \
            --output /tmp/nycif-run-discovery-feed-refresh-v3.sh
          bash -n /tmp/nycif-run-discovery-feed-refresh-v3.sh
          cp /tmp/nycif-run-discovery-feed-refresh-v3.sh scripts/run_discovery_feed_refresh.sh

      - name: Build, validate, sync Supabase, and commit READY discovery feed
        id: production
        env:
          SUPABASE_WRITE_ENABLED: 'true'
          SUPABASE_TARGET_ENV: 'staging'
          SUPABASE_PROJECT_REF: 'oggwpvdirkrnzoolparx'
          SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/run_discovery_feed_refresh.sh

      - name: Publish BLOCKED God View status without changing feeds
        if: failure()
        run: bash scripts/publish_blocked_daily_refresh.sh
