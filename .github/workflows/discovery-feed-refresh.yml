name: Discovery Feed Refresh
run-name: Discovery Feed Refresh @ ${{ github.sha }}

# Atomic daily production transaction for the NYC In Focus News Desk.
# The repository-owned transaction script records an actionable stage and safe
# command identifier before every executable phase. Failed transactions publish
# only BLOCKED operator health; partial public feed JSON is discarded.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *'
      timezone: "America/New_York"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discovery-feed-refresh.yml'
      - 'scripts/run_discovery_feed_refresh.sh'
      - 'scripts/prepare_v3_runtime_validator.py'
      - 'tests/test_prepare_v3_runtime_validator.py'
      - 'scripts/occurrence_identity_contract.py'
      - 'tests/test_occurrence_identity_contract.py'
      - 'scripts/apply_approximate_marker_recovery_v1.py'
      - 'scripts/build_maplibre_reader_safe_with_approx_v1.py'
      - 'scripts/build_approximate_marker_reader_v1.py'
      - 'scripts/build_location_resolution_backlog_v1.py'
      - 'tests/test_location_resolution_backlog_v1.py'
      - 'scripts/sync_supabase_location_registry_v1.py'
      - 'tests/test_supabase_location_registry_sync_v1.py'
      - 'scripts/sources/**'
      - 'tests/test_ticketmaster_source_adapter.py'
      - 'supabase/migrations/**'
      - 'scripts/publish_blocked_daily_refresh.sh'
      - 'scripts/run_daily_refresh_stage.py'
      - 'scripts/test_live_event_intake_refresh_current.py'
      - 'scripts/live_event_intake_refresh.py'
      - 'scripts/sync_nyc_open_data.py'
      - 'scripts/sync_nyc_citywide_events_calendar.py'
      - 'scripts/sync_nyc_parks_bigapps_events.py'
      - 'scripts/build_staged_production_feed.py'
      - 'scripts/refresh_official_supplemental_occurrences.py'
      - 'scripts/enforce_strict_discovery_reconciliation.py'
      - 'scripts/refresh_runtime_fallback_feeds.py'
      - 'scripts/record_blocked_daily_data_health.py'
      - 'scripts/check_field_desk_overlay_health.py'
      - 'scripts/build_daily_data_health.py'
      - 'scripts/apply_daily_data_health_to_godview.py'
      - 'scripts/test_daily_production_hardening.py'

permissions:
  contents: write

concurrency:
  group: discovery-feed-refresh
  cancel-in-progress: true

jobs:
  refresh-discovery-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guarded V3 runtime validation
        run: |
          python -m py_compile scripts/prepare_v3_runtime_validator.py scripts/build_location_resolution_backlog_v1.py scripts/sync_supabase_location_registry_v1.py scripts/sources/base.py scripts/sources/ticketmaster.py
          python -m unittest tests.test_prepare_v3_runtime_validator -v
          python -m unittest tests.test_occurrence_identity_contract -v
          python -m unittest tests.test_location_resolution_backlog_v1 -v
          python -m unittest tests.test_supabase_location_registry_sync_v1 -v
          python -m unittest tests.test_ticketmaster_source_adapter -v
          python scripts/prepare_v3_runtime_validator.py \
            --source scripts/run_discovery_feed_refresh.sh \
            --output /tmp/nycif-run-discovery-feed-refresh-v3.sh
          bash -n /tmp/nycif-run-discovery-feed-refresh-v3.sh
          cp /tmp/nycif-run-discovery-feed-refresh-v3.sh scripts/run_discovery_feed_refresh.sh

      - name: Build, validate, and commit READY discovery feed
        id: production
        run: bash scripts/run_discovery_feed_refresh.sh

      - name: Persist approved V3 location knowledge
        if: success()
        env:
          SUPABASE_URL: 'https://oggwpvdirkrnzoolparx.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python scripts/sync_supabase_location_registry_v1.py --apply
          python - <<'PY'
          import json
          report = json.load(open('data/location_registry_sync_v1_report.json'))
          if report.get('qa_pass') is not True or report.get('applied') is not True:
              raise SystemExit('durable location registry sync did not pass/apply')
          if report.get('approximate_certified_count') != 0:
              raise SystemExit('approximate location was incorrectly certified')
          if report.get('protected_cache_modified') is not False or report.get('event_rows_modified') is not False:
              raise SystemExit('location sync mutated protected source authority')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Build non-promoting unresolved location backlog
        if: success()
        run: |
          python scripts/build_location_resolution_backlog_v1.py
          python - <<'PY'
          import json
          report = json.load(open('data/location_resolution_backlog_v1_report.json'))
          if report.get('qa_pass') is not True:
              raise SystemExit('location resolution backlog QA failed')
          if report.get('promotion_attempt_count') != 0:
              raise SystemExit('promotion_attempt_count must remain zero')
          for key in ('public_map_modified', 'location_cache_modified', 'staged_feed_modified'):
              if report.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/location_registry_sync_v1_payload.json \
            data/location_registry_sync_v1_report.json \
            data/location_resolution_backlog_v1.json \
            data/location_resolution_backlog_v1_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh durable location authority reports"
            git push origin HEAD:main
          fi

      - name: Publish BLOCKED God View status without changing feeds
        if: failure()
        run: bash scripts/publish_blocked_daily_refresh.sh
