name: Discovery Feed Refresh

# Fetches fresh NYC permit data, resolves map-ready locations, rebuilds the
# public discovery event feed the Field Desk map consumes
# (data/schema-v1-discovery/**), and commits the result back to main.
#
# The prior workflow rebuilt only from committed snapshots. That allowed the
# derived feed to refresh while newly issued permits never entered the source
# snapshot. The live intake refresh now runs inside the same retry loop so each
# derived commit is built from the current NYC Open Data export.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discovery-feed-refresh.yml'
      - 'scripts/live_event_intake_refresh.py'
      - 'scripts/test_live_event_intake_refresh.py'

permissions:
  contents: write

concurrency:
  group: discovery-feed-refresh
  cancel-in-progress: false

jobs:
  refresh-discovery-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify live intake regression contract
        run: python scripts/test_live_event_intake_refresh.py

      - name: Build and commit discovery feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The source snapshots and discovery feed are derived state. If main
          # advances between checkout and push, rebuild everything from the new
          # tip and try again. Never merge, resolve generated conflicts, or
          # force-push over main.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD

            # Pull the complete current NYC permit dataset, resolve new street
            # locations, and rebuild the map-ready staged feed before projecting
            # the public discovery pages.
            python scripts/live_event_intake_refresh.py

            # Two-step discovery pipeline: the schema-v1 major build produces
            # the major key set that the projector reads to flag Featured
            # events; the projector then writes data/schema-v1-discovery/**.
            python scripts/build_events_schema_v1_major.py
            python scripts/build_street_festivals_feed.py
            python scripts/project_events_discovery_v02.py

            # "What's New" diff + category coverage over the fresh staged
            # snapshot. This emits only the diff + coverage because the frontend
            # loads the full event set through the discovery approved pages.
            python scripts/build_comprehensive_event_feed.py

            python scripts/generate_godview_project_state.py --fetch-github

            # Fail closed: never commit an empty or malformed public feed, and
            # ensure the live source, enrichment and staging chain completed.
            python - <<'PY'
          import glob
          import json
          import sys

          raw = json.load(open("data/raw_nyc_open_data_snapshot.json"))
          live = json.load(open("data/live_sync_report.json"))
          test_manifest = json.load(open("data/test_enriched_feed_manifest.json"))
          staged_manifest = json.load(open("data/staged_live_manifest.json"))
          staged = json.load(open("data/nycif_staged_live_events.json"))
          major = json.load(open("data/schema-v1-discovery/major/events.json"))
          manifest = json.load(open("data/schema-v1-discovery/approved/manifest.json"))
          pages = glob.glob("data/schema-v1-discovery/approved/pages/*.json")
          report = json.load(open("data/comprehensive_feed_report.json"))
          whats_new = json.load(open("data/nycif_new_events.json"))

          if not isinstance(raw, list) or not raw:
              sys.exit("live NYC Open Data snapshot is empty")
          if live.get("raw_rows_loaded") != len(raw):
              sys.exit(
                  f"live sync count {live.get('raw_rows_loaded')} != raw snapshot {len(raw)}"
              )
          if test_manifest.get("raw_rows_loaded") != len(raw):
              sys.exit(
                  f"test enrichment count {test_manifest.get('raw_rows_loaded')} != raw snapshot {len(raw)}"
              )
          staged_events = staged.get("events") if isinstance(staged, dict) else None
          if not isinstance(staged_events, list) or not staged_events:
              sys.exit("staged map-ready feed has no events")
          if staged_manifest.get("staged_feed_events") != len(staged_events):
              sys.exit(
                  f"staged manifest count {staged_manifest.get('staged_feed_events')} != staged rows {len(staged_events)}"
              )
          if not major.get("events"):
              sys.exit("major feed has no events")
          if manifest.get("page_count") != len(pages) or not pages:
              sys.exit(
                  f"approved manifest page_count {manifest.get('page_count')} != {len(pages)} page files"
              )
          if not manifest.get("latest_date"):
              sys.exit("approved manifest missing latest_date")
          if not report.get("qa_pass") or report.get("kept", 0) < 1:
              sys.exit("coverage report failed QA / scanned no events")
          if "new_this_run" not in whats_new:
              sys.exit("what's-new diff missing new_this_run")

          print(
              f"validated: {len(raw)} live source rows, {len(staged_events)} staged map-ready events, "
              f"{len(major['events'])} major, {manifest.get('total')} approved across {len(pages)} pages, "
              f"{report['kept']} scanned ({whats_new['new_this_run']} new this run)"
          )
          PY

            git add \
              data/raw_nyc_open_data_snapshot.json \
              data/live_sync_report.json \
              data/nycif_live_test_enriched_events.json \
              data/test_enriched_feed_manifest.json \
              data/nycif_staged_live_events.json \
              data/staged_live_manifest.json \
              data/nyc_geosearch_gazetteer_cache.json \
              data/schema-v1-discovery \
              data/nycif_new_events.json \
              data/comprehensive_feed_report.json \
              data/_event_seen_index.json \
              data/nycif_street_festivals_feed.json \
              data/events_discovery_contract_v02.json \
              data/events_discovery_v02_approved.json \
              data/events_discovery_v02_review.json \
              data/events_discovery_v02_major.json \
              data/events_discovery_taxonomy_v02_audit.json \
              data/events_discovery_reconciliation_v02.json \
              data/events_discovery_grouping_v02_report.json \
              data/events_discovery_schema_validation_v02.json \
              data/events_schema_v1_major.json \
              data/events_schema_v1_major_report.json \
              status/nycif-godview-project-state-v02.json \
              status/nycif-github-tracker.json \
              status/nycif-project-status.json \
              status/nycif-live-pipeline-dashboard.json \
              data/reports/godview_project_state_report.json \
              docs/events-discovery-taxonomy-v02.md \
              docs/field-desk-map-deploy
            if git diff --cached --quiet; then
              echo "No live source or discovery feed changes to commit."
              exit 0
            fi

            git commit -m "Refresh live event intake and discovery feed"
            if git push origin HEAD:main; then
              echo "Pushed live source and discovery feed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (main advanced since fetch); rebuilding on the new tip (attempt ${attempt} of 3)."
            sleep $((attempt * 10))
          done

          echo "::error::Could not push live source and discovery feed after 3 attempts; main kept advancing. Re-run the workflow."
          exit 1
