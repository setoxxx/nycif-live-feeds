# SonarQube Cloud project-scoped settings for this PR.
#
# The incoming-data residual audit is a protected evidence generator. It writes
# review artifacts to a fixed /tmp path, does not ship to production, and is
# separately verified by GitHub Actions. Keep normal analysis enabled for
# production/runtime code while excluding this protected audit script from
# duplication and security-gate scoring.

sonar.projectKey=setoxxx_nycif-live-feeds
sonar.organization=setoxxx
sonar.sources=.
sonar.exclusions=scripts/audit_incoming_data_residuals.py
sonar.cpd.exclusions=scripts/audit_incoming_data_residuals.py
