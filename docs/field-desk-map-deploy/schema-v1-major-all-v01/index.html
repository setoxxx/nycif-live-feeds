<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NYC In Focus">
  <title>NYC In Focus · NYC Event Map</title>

  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="preconnect" href="https://{s}.tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css?v=public-map-v07">
  <link rel="stylesheet" href="./fielddesk-v02.css?v=public-map-v07">
  <link rel="stylesheet" href="./weekstrip-v06-safe.css?v=public-map-v07">
  <link rel="stylesheet" href="./public-map-v01.css?v=public-map-v07">
</head>
<body class="public-map-page">
  <main id="app" class="app">
    <section class="map-shell" aria-label="NYC In Focus public event map">
      <div id="map" class="map" role="application" aria-label="NYC event map"></div>

      <div class="brand-card" aria-label="NYC In Focus Event Map status">
        <div class="brand-mark">NYCIF</div>
        <div>
          <strong>NYC</strong>
          <span id="brandCount">Loading NYC events…</span>
        </div>
      </div>

      <div id="viewBanner" class="view-banner" hidden></div>
      <div id="indexStatus" class="index-status" hidden></div>

      <div id="dateChips" class="date-chips" aria-label="Choose a day"></div>

      <div class="map-controls" aria-label="Map controls">
        <button id="layersBtn" class="pill layers-pill" type="button" aria-expanded="false" aria-controls="layersPanel">
          <span>☰</span><b>Filters</b>
        </button>
        <button id="nearMeBtn" class="near-me-btn" type="button" aria-label="Sort events near me" title="Near me">Near Me</button>
        <button id="locateBtn" class="locate-btn" type="button" aria-label="Show my location" title="Show my location">⌖</button>
        <button id="bugBtn" class="bug-btn" type="button" aria-label="Report a problem" title="Report a problem">🐞</button>
      </div>

      <aside id="layersPanel" class="layers-panel" aria-label="Choose what to show" hidden>
        <p class="panel-label">Choose what to show</p>

        <div class="editors-block">
          <label class="check newsdesk-check"><input type="checkbox" id="newsDeskToggle" checked> <span>📰 News Desk <small>money shots + viral</small></span></label>
          <label class="editors-pick">
            <span>🏅 Editor's Picks</span>
            <select id="editorsPicksSelect" aria-label="Editor's Picks medal filter">
              <option value="all">Show all events</option>
              <option value="medaled">Medals only 🥇🥈🥉</option>
              <option value="gold">Gold only 🥇</option>
            </select>
          </label>
        </div>

        <label class="check"><input type="checkbox" data-cat="sports" checked> <span>🏟️ Sports</span></label>
        <label class="check"><input type="checkbox" data-cat="fitness" checked> <span>💪 Fitness / wellness</span></label>
        <label class="check"><input type="checkbox" data-cat="parks" checked> <span>🌳 Parks / outdoors</span></label>
        <label class="check"><input type="checkbox" data-cat="arts" checked> <span>🎭 Arts / culture</span></label>
        <label class="check"><input type="checkbox" data-cat="market" checked> <span>🛍️ Markets / street fairs</span></label>
        <label class="check"><input type="checkbox" data-cat="civic" checked> <span>📣 Civic / neighborhood</span></label>
        <label class="check"><input type="checkbox" data-cat="family" checked> <span>👨‍👩‍👧 Kids / family</span></label>
        <label class="check"><input type="checkbox" data-cat="education" checked> <span>📚 Classes / workshops</span></label>
        <label class="check"><input type="checkbox" data-cat="volunteer" checked> <span>🙋 Volunteer opportunities</span></label>
        <label class="check"><input type="checkbox" data-cat="general" checked> <span>📍 General</span></label>

        <div class="explore-more-block">
          <button id="explore-more-toggle" type="button" aria-expanded="false" aria-controls="explore-more-panel">
            🧭 Explore More
          </button>
          <div id="explore-more-panel" hidden>
            <label class="check"><input type="checkbox" data-cat="media" checked> <span>🎬 Film / production</span></label>
            <label class="check"><input type="checkbox" data-cat="tours" checked> <span>🗺️ Tours / history</span></label>
            <label class="check"><input type="checkbox" data-cat="government" checked> <span>🏛️ Government / meetings</span></label>
            <label class="check"><input type="checkbox" data-cat="services" checked> <span>🤝 Health / benefits</span></label>
            <label class="check"><input type="checkbox" data-cat="jobs" checked> <span>💼 Jobs / career</span></label>
            <label class="check"><input type="checkbox" data-cat="housing" checked> <span>🏠 Housing / tenant help</span></label>
            <label class="check"><input type="checkbox" data-cat="environment" checked> <span>🌎 Environment / nature</span></label>
          </div>
        </div>

        <hr>

        <button id="enableAllCategoriesBtn" class="load-all panel-action" type="button">Enable All</button>
        <button id="resetFiltersBtn" class="load-all panel-action" type="button">Clear Filters</button>
        <button id="retryFeedBtn" class="load-all panel-action" type="button">Retry Events</button>
      </aside>

      <button id="deskBtn" class="desk-btn" type="button" aria-expanded="false" aria-controls="deskDrawer">Event List</button>

      <aside id="deskDrawer" class="desk-drawer" aria-label="Event list" hidden>
        <header class="desk-header">
          <div>
            <p>NYC In Focus</p>
            <h1>Event Map</h1>
          </div>
          <button id="closeDeskBtn" class="close-btn" type="button" aria-label="Close event list">×</button>
        </header>

        <label class="search">
          <span class="sr-only">Search events</span>
          <input id="searchInput" type="search" placeholder="Search title, location, borough" autocomplete="off">
        </label>

        <div class="boroughs" id="boroughs"></div>

        <label class="sort">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="priority">Highlights</option>
            <option value="near">Near me</option>
            <option value="time">Time</option>
            <option value="borough">Borough</option>
            <option value="type">Type</option>
          </select>
        </label>

        <div id="listMeta" class="list-meta">Loading events...</div>
        <div id="eventList" class="event-list"></div>
        <button id="loadMoreBtn" class="load-all" type="button" hidden>Show 100 more</button>
      </aside>

      <div class="public-intro-v01"><strong>NYC In Focus:</strong> Discover public events across the five boroughs — today and the week ahead. Confirm details before you go.</div>
      <div id="status" class="status">Loading the NYC In Focus event map…</div>
      <pre id="debugPanel" class="debug-panel" hidden></pre>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
  <script src="./public-approved-overlays-capture-v01.js?v=public-map-v07"></script>
  <script src="./public-map-defaults-v01.js?v=public-map-v07"></script>
  <script src="./discovery-patch-v02.js?v=public-map-v07"></script>
  <script src="./event-feed-schema-v1.js?v=public-map-v07"></script>
  <script src="./news-desk-editors-picks-v01.js?v=public-map-v07"></script>
  <script src="./app-schema-v1-major-all-v01.js?v=public-map-v07"></script>
  <script src="./public-approved-overlays-v01.js?v=public-map-v07"></script>
  <script src="./field-desk-operator-layer-v01.js?v=public-map-v07"></script>
  <script src="./admin-whats-new-v01.js?v=public-map-v07"></script>
  <script src="./nycif-tip-jar-v01.js?v=03"></script>
  <script>
    (function () {
      var btn = document.getElementById("explore-more-toggle");
      var panel = document.getElementById("explore-more-panel");
      if (!btn || !panel) return;
      // Collapsed by default on mobile (<720px); open on larger screens for discoverability.
      var mobile = window.matchMedia("(max-width: 719px)").matches;
      panel.hidden = mobile;
      btn.setAttribute("aria-expanded", mobile ? "false" : "true");
      btn.addEventListener("click", function () {
        var open = panel.hidden;
        panel.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(function () {});
    }
  </script>
</body>
</html>
