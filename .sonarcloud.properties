# SonarQube Cloud automatic-analysis scope for protected audit-only lanes.
#
# SonarQube Cloud automatic analysis ignores sonar-project.properties. This
# file is the supported repository configuration surface for automatic analysis.
# The exclusions below are exact paths for protected evidence generators and
# audit workflows only. Production/runtime code remains in normal analysis.

sonar.exclusions=scripts/audit_incoming_data_residuals.py,.github/workflows/incoming-data-residual-audit.yml,scripts/audit_occurrence_identity_enforcement.py,.github/workflows/occurrence-identity-enforcement-audit.yml
sonar.cpd.exclusions=scripts/audit_incoming_data_residuals.py,.github/workflows/incoming-data-residual-audit.yml,scripts/audit_occurrence_identity_enforcement.py,.github/workflows/occurrence-identity-enforcement-audit.yml
