# SonarQube Cloud automatic-analysis settings for the protected source-lineage audit lane.
#
# These exclusions are limited to protected evidence generators and their audit
# workflows. They write review artifacts, do not ship to production, and are
# separately verified by GitHub Actions. Normal analysis remains enabled for
# production/runtime code.

sonar.projectKey=setoxxx_nycif-live-feeds
sonar.organization=setoxxx
sonar.sources=.
sonar.exclusions=scripts/audit_source_lineage_contract.py,.github/workflows/source-lineage-contract-audit.yml
sonar.cpd.exclusions=scripts/audit_source_lineage_contract.py,.github/workflows/source-lineage-contract-audit.yml
